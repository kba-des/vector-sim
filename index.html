<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>VECTOR — High Fidelity Flight Simulator</title>

<style>
:root{
  --accent:#00ffee;
  --bg:#03050a;
  --panel:rgba(8,16,28,.88);
  --danger:#ff2a55;
  --text:#d8f4ff;
  --muted:#7e95b3;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
               "Segoe UI",Roboto,sans-serif;
  touch-action:none;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#gl{z-index:1}
#hud{
  z-index:2;
  pointer-events:none;
}
#ui{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
}

.touch,.btn{
  pointer-events:auto;
}

/* ================= MENU ================= */

#menu{
  position:absolute;
  inset:0;
  z-index:20;
  overflow-y:auto;

  padding:
    calc(env(safe-area-inset-top) + 20px)
    20px
    calc(env(safe-area-inset-bottom) + 20px);

  background:
    radial-gradient(
      120% 100% at 50% 100%,
      #18233c 0%,
      #090d18 52%,
      #03050a 100%
    );
}

#menu h1{
  text-align:center;
  color:var(--accent);
  font-size:36px;
  font-weight:950;
  letter-spacing:.32em;
  text-shadow:0 0 18px rgba(0,255,238,.6);
}

.sub{
  text-align:center;
  color:#8ba2c4;
  font-size:10px;
  font-weight:800;
  letter-spacing:.2em;
  margin:7px 0 18px;
}

.grid{
  width:min(1160px,100%);
  margin:auto;

  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(210px,1fr));

  gap:10px;
}

.card{
  position:relative;
  padding:14px;

  border:1px solid rgba(0,255,238,.25);
  border-radius:12px;

  background:rgba(12,18,32,.78);

  transition:
    transform .15s ease,
    border-color .15s ease,
    background .15s ease;
}

.card.sel{
  border-color:var(--accent);
  background:rgba(0,255,238,.11);
  box-shadow:0 0 20px rgba(0,255,238,.28);
  transform:translateY(-2px);
}

.card .nm{
  color:#fff;
  font-size:15px;
  font-weight:900;
}

.card .mt{
  margin-top:6px;
  color:var(--muted);
  font:10px/1.5 monospace;
}

.card .tag{
  position:absolute;
  top:10px;
  right:10px;

  padding:3px 6px;
  border-radius:4px;

  color:var(--accent);
  border:1px solid rgba(0,255,238,.5);

  font:900 8px monospace;
}

#startBtn{
  width:max-content;
  margin:20px auto 8px;

  padding:15px 48px;

  border-radius:12px;

  background:var(--accent);
  color:#03050a;

  font-size:14px;
  font-weight:950;
  letter-spacing:.2em;

  box-shadow:0 0 30px rgba(0,255,238,.55);
}

.hint{
  max-width:900px;
  margin:8px auto;

  color:#6b829e;
  text-align:center;

  font:10px/1.55 monospace;
}

/* ================= JOYSTICK ================= */

#stickZone{
  position:absolute;
  left:0;
  bottom:0;

  width:48%;
  height:70%;
}

#stickBase,
#stickKnob{
  position:absolute;
  display:none;

  transform:translate(-50%,-50%);
  pointer-events:none;
}

#stickBase{
  width:132px;
  height:132px;

  border:1px solid var(--accent);
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(0,255,238,.14),
      transparent 70%
    );
}

#stickKnob{
  width:52px;
  height:52px;

  border:2px solid #fff;
  border-radius:50%;

  background:var(--accent);

  box-shadow:0 0 18px var(--accent);
}

/* ================= THROTTLE ================= */

#thrZone{
  position:absolute;

  right:12px;
  top:18%;
  bottom:25%;

  width:62px;

  display:flex;
  align-items:center;
  justify-content:center;
}

#thrTrack{
  position:relative;

  width:12px;
  height:100%;

  border:1px solid var(--accent);
  border-radius:8px;

  background:rgba(10,20,35,.9);
}

#thrFill{
  position:absolute;

  left:0;
  bottom:0;

  width:100%;
  height:0;

  border-radius:8px;

  background:var(--accent);
  box-shadow:0 0 14px var(--accent);
}

#thrKnob{
  position:absolute;

  left:50%;
  bottom:0;

  width:42px;
  height:24px;

  transform:translate(-50%,50%);

  border:2px solid var(--accent);
  border-radius:6px;

  background:#fff;
}

/* ================= BUTTONS ================= */

.btnGroup{
  position:absolute;

  right:calc(env(safe-area-inset-right) + 82px);
  bottom:calc(env(safe-area-inset-bottom) + 18px);

  display:grid;
  grid-template-columns:repeat(3,52px);
  gap:7px;
}

.topBar{
  position:absolute;

  left:calc(env(safe-area-inset-left) + 12px);
  top:calc(env(safe-area-inset-top) + 12px);

  display:flex;
  gap:7px;
}

.yawGroup{
  position:absolute;

  left:calc(env(safe-area-inset-left) + 12px);
  bottom:calc(env(safe-area-inset-bottom) + 18px);

  display:flex;
  gap:7px;
}

.btn{
  width:52px;
  height:41px;

  border-radius:8px;

  border:1px solid rgba(0,255,238,.4);
  background:var(--panel);

  color:var(--text);

  display:flex;
  align-items:center;
  justify-content:center;

  font:900 9px monospace;

  backdrop-filter:blur(7px);

  box-shadow:
    0 0 8px rgba(0,255,238,.15);
}

.btn.on{
  background:var(--accent);
  color:#03050a;
  box-shadow:0 0 16px rgba(0,255,238,.6);
}

/* ================= STATUS ================= */

#msg{
  position:absolute;

  left:50%;
  top:38%;

  transform:translate(-50%,-50%);

  display:none;

  z-index:8;

  text-align:center;

  color:var(--danger);

  font:950 30px monospace;

  letter-spacing:.15em;

  text-shadow:0 0 26px var(--danger);
}

#msg small{
  display:block;

  margin-top:10px;

  color:#ffd0d8;

  font-size:11px;
  letter-spacing:.08em;
}

#toast{
  position:absolute;

  left:50%;
  top:9%;

  transform:translateX(-50%);

  padding:8px 18px;

  border:1px solid var(--accent);
  border-radius:20px;

  background:rgba(8,16,28,.94);

  color:var(--accent);

  font:900 10px monospace;

  opacity:0;

  transition:opacity .2s;
}

#loading{
  position:absolute;
  inset:0;

  z-index:50;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#03050a;

  color:var(--accent);

  font:700 13px monospace;

  letter-spacing:.28em;
}
</style>
</head>

</div>

<div id="menu">

/* =========================================================
   ATMOSPHERE
   ========================================================= */

const ISA={

  get(alt){

    alt=Math.max(0,alt);

    let T,P;

    if(alt<=11000){

      T=288.15-.0065*alt;

      P=
        101325*
        Math.pow(T/288.15,5.25588);

    }

    else if(alt<=20000){

      T=216.65;

      P=
        22632.06*
        Math.exp(
          -G0*(alt-11000)/
          (287.05*T)
        );

    }

    else{

      T=216.65+.001*(alt-20000);

      P=
        5474.88*
        Math.pow(
          T/216.65,
          -G0/(287.05*.001)
        );

    }

    const rho=P/(287.05*T);

    const sound=
      Math.sqrt(
        1.4*287.05*T
      );

    return{
      T,
      P,
      rho,
      sound
    };
  }

};

/* =========================================================
   RUNWAY / TERRAIN
   ========================================================= */

const RW_START_Z=1800;
const RW_END_Z=-2400;
const RW_WIDTH=34;

function terrainHeight(x,z){

  const broad=
    Math.sin(x*.00032)*18+
    Math.sin(z*.00021)*12+
    Math.sin((x+z)*.00011)*30;

  const detail=
    Math.sin(x*.0013+z*.0008)*4;

  return Math.max(-30,broad+detail);
}

/* =========================================================
   SCENE
   ========================================================= */

function initScene(){

  scene=new THREE.Scene();

  scene.background=
    new THREE.Color(0x88aac7);

  scene.fog=
    new THREE.FogExp2(
      0x9bb8d0,
      .000012
    );

  camera=
    new THREE.PerspectiveCamera(
      60,
      innerWidth/innerHeight,
      .1,
      300000
    );

  renderer=
    new THREE.WebGLRenderer({
      canvas:document.getElementById('gl'),
      antialias:true,
      powerPreference:'high-performance'
    });

  renderer.outputEncoding=
    THREE.sRGBEncoding;

  renderer.toneMapping=
    THREE.ACESFilmicToneMapping;

  renderer.toneMappingExposure=1;

  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=
    THREE.PCFSoftShadowMap;

  /* lighting */

  scene.add(
    new THREE.HemisphereLight(
      0xd7ecff,
      0x39432f,
      1.25
    )
  );

  sun=
    new THREE.DirectionalLight(
      0xffffff,
      2.1
    );

  sun.castShadow=true;

  sun.shadow.mapSize.set(
    1024,
    1024
  );

  sun.shadow.camera.near=10;
  sun.shadow.camera.far=6000;

  scene.add(sun);
  scene.add(sun.target);

  /* terrain */

  const ground=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        80000,
        80000,
        96,
        96
      ),
      new THREE.MeshStandardMaterial({
        color:0x4b5b40,
        roughness:1
      })
    );

  ground.rotation.x=-Math.PI/2;

  const pos=
    ground.geometry.attributes.position;

  for(let i=0;i<pos.count;i++){

    const x=pos.getX(i);
    const z=pos.getY(i);

    pos.setZ(
      i,
      terrainHeight(x,z)
    );

  }

  pos.needsUpdate=true;

  ground.geometry.computeVertexNormals();

  ground.receiveShadow=true;

  scene.add(ground);

  /* ocean */

  const ocean=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        300000,
        300000
      ),
      new THREE.MeshStandardMaterial({
        color:0x174e69,
        roughness:.65,
        metalness:.05
      })
    );

  ocean.rotation.x=-Math.PI/2;
  ocean.position.y=-30;

  scene.add(ocean);

  /* runway */

  const runway=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        RW_WIDTH,
        RW_START_Z-RW_END_Z
      ),
      new THREE.MeshStandardMaterial({
        color:0x25282d,
        roughness:.92
      })
    );

  runway.rotation.x=-Math.PI/2;

  runway.position.set(
    0,
    .03,
    (RW_START_Z+RW_END_Z)/2
  );

  runway.receiveShadow=true;

  scene.add(runway);

  /* runway centre markings */

  for(
    let z=RW_START_Z-90;
    z>RW_END_Z;
    z-=90
  ){

    const mark=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          1.0,
          .025,
          36
        ),
        new THREE.MeshBasicMaterial({
          color:0xffffff
        })
      );

    mark.position.set(
      0,
      .06,
      z
    );

    scene.add(mark);
  }

  /* runway edges */

  for(
    const x of [
      -RW_WIDTH/2+1.3,
      RW_WIDTH/2-1.3
    ]
  ){

    const edge=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          1.2,
          .025,
          RW_START_Z-RW_END_Z
        ),
        new THREE.MeshBasicMaterial({
          color:0xffffff
        })
      );

    edge.position.set(
      x,
      .065,
      (RW_START_Z+RW_END_Z)/2
    );

    scene.add(edge);

  }

  /* runway lights */

  for(
    let z=RW_START_Z-80;
    z>RW_END_Z;
    z-=80
  ){

    for(
      const x of [-18,18]
    ){

      const light=
        new THREE.Mesh(
          new THREE.SphereGeometry(
            .16,
            8,
            8
          ),
          new THREE.MeshBasicMaterial({
            color:0xfff1c2
          })
        );

      light.position.set(
        x,
        .35,
        z
      );

      scene.add(light);

    }

  }

}

/* =========================================================
   AIRCRAFT MODEL
   ========================================================= */

function createAirfoil(
  span,
  chord,
  sweep,
  side
){

  const half=span*.5;

  const shape=
    new THREE.Shape();

  shape.moveTo(0,0);
  shape.lineTo(chord*.82,0);
  shape.lineTo(chord,half*.02);
  shape.lineTo(chord*.20,half);
  shape.lineTo(0,half*.94);
  shape.closePath();

  const geo=
    new THREE.ExtrudeGeometry(
      shape,
      {
        depth:.055,
        bevelEnabled:false
      }
    );

  geo.rotateX(Math.PI/2);

  return geo;
}

function createFighter(cfg){

  const root=
    new THREE.Group();

  const L=cfg.length;
  const R=L*.055;

  const bodyMat=
    new THREE.MeshStandardMaterial({
      color:0x687480,
      metalness:.72,
      roughness:.30
    });

  const darkMat=
    new THREE.MeshStandardMaterial({
      color:0x202832,
      metalness:.82,
      roughness:.22
    });

  const canopyMat=
    new THREE.MeshStandardMaterial({
      color:0x102a39,
      metalness:.15,
      roughness:.08,
      transparent:true,
      opacity:.78
    });

  /* fuselage */

  const fuselage=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        R*.82,
        R,
        L,
        18
      ),
      bodyMat
    );

  fuselage.rotation.x=
    Math.PI/2;

  root.add(fuselage);

  /* nose */

  const nose=
    new THREE.Mesh(
      new THREE.ConeGeometry(
        R*.84,
        L*.55,
        18
      ),
      bodyMat
    );

  nose.rotation.x=
    -Math.PI/2;

  nose.position.z=
    -L*.62;

  root.add(nose);

  /* canopy */

  const canopy=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        R*1.25,
        16,
        10,
        0,
        Math.PI*2,
        0,
        Math.PI*.55
      ),
      canopyMat
    );

  canopy.scale.set(
    .8,
    1,
    .9
  );

  canopy.position.set(
    0,
    R*.72,
    -L*.12
  );

  root.add(canopy);

  const elevators=[];
  const rudders=[];

  /* wings + tails */

  for(
    const side of [-1,1]
  ){

    const wing=
      new THREE.Mesh(
        createAirfoil(
          cfg.span*.95,
          L*.32,
          cfg.sweep,
          side
        ),
        bodyMat
      );

    wing.position.set(
      side*cfg.span*.08,
      0,
      L*.08
    );

    wing.scale.x=side;

    root.add(wing);

    const elevator=
      new THREE.Mesh(
        createAirfoil(
          cfg.span*.30,
          L*.13,
          cfg.sweep*.7,
          side
        ),
        darkMat
      );

    elevator.position.set(
      side*cfg.span*.10,
      0,
      L*.39
    );

    elevator.scale.x=side;

    root.add(elevator);

    elevators.push(elevator);

    const fin=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          L*.06,
          R*4,
          L*.25
        ),
        bodyMat
      );

    fin.position.set(
      side*cfg.span*.14,
      R*3.3,
      L*.28
    );

    fin.rotation.z=
      side*.35;

    root.add(fin);

    rudders.push(fin);

    /* canards */

    if(cfg.canard){

      const canard=
        new THREE.Mesh(
          createAirfoil(
            cfg.span*.22,
            L*.10,
            cfg.sweep*.5,
            side
          ),
          bodyMat
        );

      canard.position.set(
        side*cfg.span*.10,
        R*.5,
        -L*.30
      );

      canard.scale.x=side;

      root.add(canard);

    }

  }

  /* intake */

  const intake=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        cfg.span*.65,
        R*.75,
        L*.08
      ),
      darkMat
    );

  intake.position.set(
    0,
    -R*.15,
    -L*.18
  );

  root.add(intake);

  /* engines */

  const nozzles=[];

  const enginePositions=
    cfg.engines===2
    ? [cfg.engineX,-cfg.engineX]
    : [0];

  for(
    const x of enginePositions
  ){

    const nozzle=
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          R*.45,
          R*.50,
          R*.11,
          18
        ),
        darkMat
      );

    nozzle.rotation.x=
      Math.PI/2;

    nozzle.position.set(
      x,
      0,
      L*.58
    );

    root.add(nozzle);

    const flame=
      new THREE.Mesh(
        new THREE.ConeGeometry(
          R*.34,
          L*.65,
          14
        ),
        new THREE.MeshBasicMaterial({
          color:0x80eaff,
          transparent:true,
          opacity:0,
          blending:THREE.AdditiveBlending
        })
      );

    flame.rotation.x=
      -Math.PI/2;

    flame.position.set(
      x,
      0,
      L*.90
    );

    root.add(flame);

    nozzles.push({
      flame
    });

  }

  /* landing gear */

  const gear=
    new THREE.Group();

  const gearData=[

    {
      x:0,
      z:-L*.36,
      radius:.28
    },

    {
      x:cfg.span*.15,
      z:L*.18,
      radius:.42
    },

    {
      x:-cfg.span*.15,
      z:L*.18,
      radius:.42
    }

  ];

  for(
    const g of gearData
  ){

    const strut=
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .055,
          .055,
          R*1.7,
          8
        ),
        darkMat
      );

    strut.position.set(
      g.x,
      -R*.9,
      g.z
    );

    gear.add(strut);

    const wheel=
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          g.radius,
          g.radius,
          .18,
          14
        ),
        new THREE.MeshStandardMaterial({
          color:0x151515,
          roughness:.95
        })
      );

    wheel.rotation.z=
      Math.PI/2;

    wheel.position.set(
      g.x,
      -R*1.75,
      g.z
    );

    gear.add(wheel);

  }

  root.add(gear);

  /* condensation */

  const vapor=
    new THREE.Mesh(
      new THREE.ConeGeometry(
        cfg.span*.5,
        L*1.9,
        20,
        1,
        true
      ),
      new THREE.MeshBasicMaterial({
        color:0xffffff,
        transparent:true,
        opacity:0,
        blending:THREE.AdditiveBlending,
        side:THREE.DoubleSide
      })
    );

  vapor.rotation.x=
    Math.PI/2;

  vapor.position.z=
    L*.2;

  root.add(vapor);

  root.traverse(
    obj=>{
      if(obj.isMesh){
        obj.castShadow=true;
        obj.receiveShadow=true;
      }
    }
  );

  return{
    root,
    gear,
    nozzles,
    vapor,
    elevators,
    rudders
  };

}

/* =========================================================
   AIRCRAFT STATE
   ========================================================= */

function createAircraft(){

  if(
    aircraft &&
    aircraft.visual
  ){

    scene.remove(
      aircraft.visual.root
    );

  }

  const cfg=
    JETS[selectedJet];

  const visual=
    createFighter(cfg);

  aircraft={

    cfg,

    visual,

    pos:new THREE.Vector3(),
    vel:new THREE.Vector3(),

    quat:new THREE.Quaternion(),

    rates:new THREE.Vector3(),

    throttle:0,
    throttleTarget:0,

    afterburner:false,

    gear:1,
    gearPosition:1,

    flaps:0,

    speedBrake:0,

    fuel:1,

    mach:0,
    ias:0,
    tas:0,

    aoa:0,
    beta:0,

    g:1,
    peakG:1,

    verticalSpeed:0,

    onGround:true,
    crashed:false,

    fbw:true

  };

  scene.add(
    visual.root
  );

  resetAircraft();

}

/* =========================================================
   RESET
   ========================================================= */

function resetAircraft(){

  const p=aircraft;

  /*
    IMPORTANT:

    The aircraft's aerodynamic nose is local -Z.

    Runway 36 goes toward decreasing Z.

    Therefore identity rotation is correct.
  */

  p.pos.set(
    0,
    3.6,
    RW_START_Z-80
  );

  p.vel.set(
    0,
    0,
    0
  );

  p.quat.identity();

  p.rates.set(
    0,
    0,
    0
  );

  p.throttle=0;
  p.throttleTarget=0;

  p.afterburner=false;

  p.gear=1;
  p.gearPosition=1;

  p.flaps=0;

  p.speedBrake=0;

  p.fuel=1;

  p.g=1;
  p.peakG=1;

  p.crashed=false;
  p.onGround=true;

  document
    .getElementById('msg')
    .style.display='none';

  chaseInitialized=false;
  flybyInitialized=false;

  syncButtons();

}

/* =========================================================
   AERODYNAMICS
   ========================================================= */

function updateFlightDynamics(dt){

  const p=aircraft;
  const c=p.cfg;

  const atmosphere=
    ISA.get(p.pos.y);

  const mass=
    c.massEmpty+
    c.fuelMax*p.fuel;

  const speed=
    p.vel.length();

  /* body axes */

  V.forward
    .set(0,0,-1)
    .applyQuaternion(p.quat);

  V.up
    .set(0,1,0)
    .applyQuaternion(p.quat);

  V.right
    .set(1,0,0)
    .applyQuaternion(p.quat);

  /* velocity in body frame */

  V.localVelocity
    .copy(p.vel)
    .applyQuaternion(
      V.q.copy(p.quat).invert()
    );

  const u=
    Math.max(
      1,
      -V.localVelocity.z
    );

  const v=
    V.localVelocity.x;

  const w=
    V.localVelocity.y;

  /* telemetry */

  p.tas=speed;

  p.mach=
    speed/
    Math.max(
      1,
      atmosphere.sound
    );

  p.ias=
    speed*
    Math.sqrt(
      atmosphere.rho/
      1.225
    )*
    1.94384;

  p.verticalSpeed=
    p.vel.y*
    196.85;

  p.aoa=
    Math.atan2(
      -w,
      u
    );

  p.beta=
    Math.atan2(
      v,
      u
    );

  /* dynamic pressure */

  const q=
    .5*
    atmosphere.rho*
    speed*
    speed;

  /*
    Lift curve.

    At low AoA:
      CL ≈ CLa × AoA

    Flaps add lift.

    Beyond stall:
      lift collapses progressively.
  */

  let CL=
    c.CLa*p.aoa+
    p.flaps*.45;

  const stallAoA=
    c.stallAoA*
    (1-.12*p.flaps);

  if(
    Math.abs(p.aoa)>
    stallAoA
  ){

    const excess=
      Math.abs(p.aoa)-
      stallAoA;

    const stallLoss=
      Math.exp(
        -(excess*excess)/
        .12
      );

    CL=
      CL*
      (
        .45*
        stallLoss
      );

  }

  CL=
    clamp(
      CL,
      -1.5,
      1.8
    );

  /* induced drag */

  let CD=
    c.Cd0+
    (
      CL*CL
    )/
    (
      Math.PI*
      c.AR*
      .86
    );

  /* compressibility / wave drag */

  if(
    p.mach>.82
  ){

    const transonic=
      clamp(
        (p.mach-.82)/.45,
        0,
        1
      );

    CD+=
      .045*
      Math.pow(
        transonic,
        1.8
      );

  }

  /* high Mach penalty */

  if(
    p.mach>
    c.machMax*.85
  ){

    const x=
      (
        p.mach/
        c.machMax-
        .85
      )/.15;

    CD+=
      .02*
      Math.pow(
        clamp(x,0,1),
        2
      );

  }

  /* configuration drag */

  CD+=
    p.gearPosition*.025+
    p.flaps*.025+
    p.speedBrake*.065;

  /* side force */

  CD+=
    p.beta*
    p.beta*
    .9;

  const liftForce=
    q*
    c.area*
    CL;

  const dragForce=
    q*
    c.area*
    CD;

  /* engine */

  const AB=
    p.afterburner &&
    p.throttle>.90;

  let thrust=

    p.throttle*
    (
      AB
      ? c.thrustAB
      : c.thrustDry
    );

  /*
    Approximate density loss and ram
    recovery.
  */

  thrust*=
    atmosphere.rho/
    1.225;

  thrust*=
    1+
    .18*
    Math.max(
      0,
      p.mach-.4
    );

  /* force accumulator */

  V.force.set(
    0,
    -mass*G0,
    0
  );

  /* thrust */

  V.force.addScaledVector(
    V.forward,
    thrust
  );

  /* aerodynamic lift direction */

  if(speed>8){

    V.velocityDirection
      .copy(p.vel)
      .normalize();

    V.liftDirection
      .copy(
        V.right
      )
      .cross(
        V.velocityDirection
      )
      .normalize();

    /*
      Keep lift generally upward.
    */

    if(
      V.liftDirection.dot(
        V.up
      )<0
    ){

      V.liftDirection
        .multiplyScalar(-1);

    }

  }
  else{

    V.liftDirection
      .copy(V.up);

  }

  V.force.addScaledVector(
    V.liftDirection,
    liftForce
  );

  /* drag */

  if(speed>1){

    V.force.addScaledVector(
      p.vel,
      -dragForce/speed
    );

  }

  /* directional stability */

  if(speed>5){

    const sideForce=
      q*
      c.area*
      1.15*
      p.beta;

    V.force.addScaledVector(
      V.right,
      -sideForce
    );

  }

  /* acceleration */

  V.acceleration
    .copy(V.force)
    .divideScalar(mass);

  /* G */

  p.g=
    (
      V.acceleration.dot(
        V.up
      )+
      G0
    )/
    G0;

  p.peakG=
    Math.max(
      p.peakG,
      p.g
    );

  /* integrate velocity */

  p.vel.addScaledVector(
    V.acceleration,
    dt
  );

  /* integrate position */

  p.pos.addScaledVector(
    p.vel,
    dt
  );

  /* =====================================================
     FLIGHT CONTROL
     ===================================================== */

  let pitchCommand=
    input.pitch;

  let rollCommand=
    input.roll;

  let yawCommand=
    input.yaw;

  /*
    FBW protects against excessive G.
  */

  if(p.fbw){

    pitchCommand+=
      clamp(
        (.10-
         V.forward.y)*
        1.5,
        -.45,
        .45
      );

    if(
      p.g>c.gLimit &&
      pitchCommand>0
    ){

      pitchCommand*=
        clamp(
          1-
          (
            p.g-
            c.gLimit
          )/
          1.5,
          0,
          1
        );

    }

  }

  const authority=
    clamp(
      q/1800,
      .05,
      1.2
    );

  let targetPitchRate=
    pitchCommand*
    c.pitchRate*
    authority;

  let targetRollRate=
    -rollCommand*
    c.rollRate*
    authority;

  let targetYawRate=
    -yawCommand*
    c.yawRate*
    authority;

  /*
    Weathercock stability.
  */

  targetYawRate+=
    p.beta*
    2.0*
    authority;

  /*
    TVC jets get additional pitch/yaw authority.
  */

  if(
    c.tvc &&
    thrust>0
  ){

    const tvc=
      (
        thrust/
        c.thrustAB
      )*
      c.tvcAuthority;

    targetPitchRate+=
      pitchCommand*
      tvc*
      3;

    targetYawRate-=
      yawCommand*
      tvc*
      1.5;

  }

  /*
    First-order rate response.

    This is intentionally stable and mobile-friendly.
  */

  const response=
    1-
    Math.exp(
      -dt*7
    );

  p.rates.x=
    lerp(
      p.rates.x,
      targetPitchRate,
      response
    );

  p.rates.y=
    lerp(
      p.rates.y,
      targetYawRate,
      response
    );

  p.rates.z=
    lerp(
      p.rates.z,
      targetRollRate,
      response
    );

  /* =====================================================
     GROUND HANDLING
     ===================================================== */

  const runwayArea=
    Math.abs(p.pos.x)<
    RW_WIDTH/2 &&
    p.pos.z<
    RW_START_Z &&
    p.pos.z>
    RW_END_Z;

  const groundY=
    runwayArea
    ? 0
    : terrainHeight(
        p.pos.x,
        p.pos.z
      );

  const groundHeight=
    groundY+
    3.6;

  if(
    p.pos.y<=groundHeight
  ){

    /*
      Hard touchdown detection.
    */

    if(
      !p.onGround &&
      p.vel.y<
      -12.5
    ){

      crash(
        'HARD LANDING'
      );

      return;

    }

    p.pos.y=
      groundHeight;

    if(
      p.vel.y<0
    ){

      p.vel.y=0;

    }

    p.onGround=true;

    /*
      Ground rolling resistance.
    */

    const speed=
      p.vel.length();

    const rollingResistance=
      .35+
      (
        input.brake
        ? 1.8
        : 0
      )+
      p.speedBrake*.45;

    if(speed>1){

      const decel=
        rollingResistance*
        G0*
        dt;

      p.vel.multiplyScalar(
        Math.max(
          0,
          1-
          decel/speed
        )
      );

    }

    /*
      Nose rotation authority during takeoff roll.
    */

    if(
      speed>65
    ){

      p.rates.x+=
        input.pitch*
        1.5*
        dt;

    }

  }
  else{

    if(
      p.onGround &&
      p.vel.y<
      -12.5
    ){

      crash(
        'HARD LANDING'
      );

      return;

    }

    p.onGround=false;

  }

  /* =====================================================
     ORIENTATION INTEGRATION
     ===================================================== */

  V.q.setFromEuler(

    new THREE.Euler(
      p.rates.x*dt,
      p.rates.y*dt,
      p.rates.z*dt,
      'XYZ'
    )

  );

  p.quat
    .multiply(V.q)
    .normalize();

  /* =====================================================
     FUEL
     ===================================================== */

  const fuelRate=
    (
      .00022+
      .0018*
      p.throttle
    )*
    (
      AB
      ? 2.7
      : 1
    );

  p.fuel=
    Math.max(
      0,
      p.fuel-
      fuelRate*
      dt
    );

  if(
    p.fuel<=0
  ){

    p.throttleTarget=0;

  }

  /* smooth engine controls */

  p.throttle=
    lerp(
      p.throttle,
      p.throttleTarget,
      1-
      Math.exp(-dt*2.5)
    );

  p.gearPosition=
    lerp(
      p.gearPosition,
      p.gear,
      1-
      Math.exp(-dt*3.5)
    );

}

/* =========================================================
   CRASH
   ========================================================= */

function crash(reason){

  if(
    aircraft.crashed
  )
    return;

  aircraft.crashed=true;

  const msg=
    document.getElementById(
      'msg'
    );

  msg.innerHTML=
    'CRASH'+
    '<small>'+
    reason+
    '<br>PRESS RST TO RESPAWN'+
    '</small>';

  msg.style.display='block';

}

/* =========================================================
   MODEL ANIMATION
   ========================================================= */

function animateAircraft(){

  if(!aircraft)
    return;

  const p=aircraft;
  const n=p.visual;

  n.root.position.copy(
    p.pos
  );

  n.root.quaternion.copy(
    p.quat
  );

  /*
    Do NOT squash the entire gear vertically.

    Instead move the gear into the fuselage
    as it retracts.
  */

  n.gear.position.y=
    -(
      1-
      p.gearPosition
    )*
    p.cfg.length*.07;

  n.gear.scale.set(
    1,
    .25+
    .75*p.gearPosition,
    1
  );

  /* elevators */

  if(n.elevators[0]){

    n.elevators[0].rotation.x=
      input.pitch*.32+
      input.roll*.12;

  }

  if(n.elevators[1]){

    n.elevators[1].rotation.x=
      input.pitch*.32-
      input.roll*.12;

  }

  /* rudders */

  n.rudders.forEach(
    r=>{
      r.rotation.y=
        -input.yaw*.25;
    }
  );

  /* engine plume */

  const AB=
    p.afterburner &&
    p.throttle>.90;

  n.nozzles.forEach(
    nozzle=>{

      const amount=
        AB
        ? 1
        : p.throttle*.25;

      nozzle.flame.material.opacity=
        amount;

      nozzle.flame.scale.set(
        1,
        1+
        amount*.7,
        1
      );

    }
  );

  /* condensation */

  if(
    p.mach>.92 &&
    p.mach<1.08
  ){

    n.vapor.material.opacity=
      clamp(
        1-
        Math.abs(
          p.mach-1
        )/.09,
        0,
        .55
      );

  }
  else{

    n.vapor.material.opacity=0;

  }

}

/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera(dt){

  if(!aircraft)
    return;

  const p=aircraft;
  const c=p.cfg;

  const f=
    V.forward
      .set(0,0,-1)
      .applyQuaternion(
        p.quat
      );

  const u=
    V.up
      .set(0,1,0)
      .applyQuaternion(
        p.quat
      );

  /* cockpit */

  if(cameraMode===0){

    camera.position
      .copy(p.pos)
      .addScaledVector(
        u,
        c.length*.12
      )
      .addScaledVector(
        f,
        c.length*.14
      );

    camera.quaternion.copy(
      p.quat
    );

    camera.fov=65;

  }

  /* chase */

  else if(cameraMode===1){

    const target=
      p.pos.clone()
      .addScaledVector(
        f,
        -c.length*2.6
      )
      .addScaledVector(
        u,
        c.length*.65
      );

    /*
      Proper initialization state.

      The old code accidentally reset the fly-by
      state every chase frame.
    */

    if(!chaseInitialized){

      chasePosition.copy(
        target
      );

      chaseInitialized=true;

    }

    chasePosition.lerp(
      target,
      1-
      Math.exp(
        -dt*6
      )
    );

    camera.position.copy(
      chasePosition
    );

    camera.lookAt(
      p.pos.clone()
      .addScaledVector(
        f,
        c.length*.35
      )
    );

    camera.fov=60;

  }

  /* fly-by */

  else if(cameraMode===2){

    if(!flybyInitialized){

      flybyPosition
        .copy(p.pos)
        .addScaledVector(
          f,
          c.length*6
        )
        .add(
          new THREE.Vector3(
            35,
            8,
            0
          )
        );

      flybyInitialized=true;

    }

    camera.position.copy(
      flybyPosition
    );

    camera.lookAt(
      p.pos
    );

    camera.fov=42;

  }

  /* orbit */

  else{

    const t=
      performance.now()*
      .00045;

    camera.position.copy(
      p.pos
    ).add(
      new THREE.Vector3(
        Math.cos(t)*
        c.length*2.3,

        c.length*.75,

        Math.sin(t)*
        c.length*2.3
      )
    );

    camera.lookAt(
      p.pos
    );

    camera.fov=55;

  }

  camera.updateProjectionMatrix();

  /*
    Keep sun around aircraft instead of
    constantly rendering a huge distant shadow map.
  */

  sun.position.copy(
    p.pos
  ).add(
    new THREE.Vector3(
      1200,
      1800,
      900
    )
  );

  sun.target.position.copy(
    p.pos
  );

  sun.target.updateMatrixWorld();

}

/* =========================================================
   HUD
   ========================================================= */

function drawHUD(){

  if(!hudCanvas)
    return;

  const d=
    devicePixelRatio||
    1;

  const w=
    hudCanvas.width/d;

  const h=
    hudCanvas.height/d;

  hudCtx.clearRect(
    0,
    0,
    w,
    h
  );

  if(!aircraft)
    return;

  const p=aircraft;

  const cx=w*.5;
  const cy=h*.48;

  hudCtx.strokeStyle=
    '#00ffee';

  hudCtx.fillStyle=
    '#00ffee';

  hudCtx.lineWidth=1.6;

  hudCtx.font=
    '700 11px monospace';

  /* body axes */

  const f=
    V.forward
      .set(0,0,-1)
      .applyQuaternion(
        p.quat
      );

  const u=
    V.up
      .set(0,1,0)
      .applyQuaternion(
        p.quat
      );

  const r=
    V.right
      .set(1,0,0)
      .applyQuaternion(
        p.quat
      );

  const pitch=
    Math.asin(
      clamp(
        f.y,
        -1,
        1
      )
    );

  const roll=
    Math.atan2(
      -r.y,
      u.y
    );

  /* pitch ladder */

  hudCtx.save();

  hudCtx.translate(
    cx,
    cy
  );

  hudCtx.rotate(
    -roll
  );

  const pp=
    h/65;

  const pitchDegrees=
    pitch*
    R2D;

  for(
    let deg=-30;
    deg<=30;
    deg+=5
  ){

    if(
      Math.abs(
        deg-
        pitchDegrees
      )>23
    )
      continue;

    const y=
      (
        pitchDegrees-
        deg
      )*
      pp;

    hudCtx.beginPath();

    hudCtx.moveTo(
      -50,
      y
    );

    hudCtx.lineTo(
      -20,
      y
    );

    hudCtx.moveTo(
      20,
      y
    );

    hudCtx.lineTo(
      50,
      y
    );

    hudCtx.stroke();

    hudCtx.fillText(
      Math.abs(deg),
      -67,
      y+4
    );

  }

  hudCtx.restore();

  /* aircraft reference */

  hudCtx.beginPath();

  hudCtx.moveTo(
    cx-22,
    cy
  );

  hudCtx.lineTo(
    cx-8,
    cy
  );

  hudCtx.lineTo(
    cx,
    cy+4
  );

  hudCtx.lineTo(
    cx+8,
    cy
  );

  hudCtx.lineTo(
    cx+22,
    cy
  );

  hudCtx.stroke();

  /* left tape */

  hudCtx.textAlign='left';

  hudCtx.fillText(
    'IAS '+
    Math.round(p.ias)+
    ' KT',
    18,
    cy-72
  );

  hudCtx.fillText(
    'M '+
    p.mach.toFixed(2),
    18,
    cy-54
  );

  hudCtx.fillText(
    'ALT '+
    Math.round(
      p.pos.y*
      3.28084
    )+
    ' FT',
    18,
    cy-36
  );

  hudCtx.fillText(
    'G '+
    p.g.toFixed(1)+
    ' / '+
    p.peakG.toFixed(1),
    18,
    cy-18
  );

  hudCtx.fillText(
    'AOA '+
    (
      p.aoa*
      R2D
    ).toFixed(1)+
    '°',
    18,
    cy
  );

  /* right */

  hudCtx.textAlign='right';

  hudCtx.fillText(
    'THR '+
    Math.round(
      p.throttle*
      100
    )+
    '%',
    w-18,
    cy-72
  );

  hudCtx.fillText(
    'FUEL '+
    Math.round(
      p.fuel*
      100
    )+
    '%',
    w-18,
    cy-54
  );

  hudCtx.fillText(
    'V/S '+
    Math.round(
      p.verticalSpeed
    )+
    ' FPM',
    w-18,
    cy-36
  );

  hudCtx.fillText(
    p.gear>.5
      ?'GEAR DOWN'
      :'GEAR UP',
    w-18,
    cy-18
  );

  hudCtx.fillText(
    p.fbw
      ?'FBW NORMAL'
      :'DIRECT LAW',
    w-18,
    cy
  );

  /* heading */

  const heading=
    (
      Math.atan2(
        -f.x,
        -f.z
      )*
      R2D+
      360
    )%
    360;

  hudCtx.textAlign='center';

  hudCtx.strokeRect(
    cx-85,
    cy-h*.37,
    170,
    23
  );

  hudCtx.fillText(
    String(
      Math.round(
        heading
      )
    ).padStart(
      3,
      '0'
    )+
    '°',
    cx,
    cy-h*.37+16
  );

  /* warnings */

  if(
    Math.abs(
      p.aoa*
      R2D
    )>20
  ){

    hudCtx.fillStyle=
      '#ff2a55';

    hudCtx.font=
      '900 18px monospace';

    hudCtx.fillText(
      'STALL',
      cx,
      cy-75
    );

  }

  if(
    p.g>
    p.cfg.gLimit
  ){

    hudCtx.fillText(
      'OVER G',
      cx,
      cy-100
    );

  }

  if(
    p.verticalSpeed<
    -3500 &&
    p.pos.y<
    1200 &&
    !p.onGround
  ){

    hudCtx.fillText(
      'PULL UP',
      cx,
      cy-125
    );

  }

}

/* =========================================================
   RESIZE / PERFORMANCE
   ========================================================= */

function resize(){

  /*
    Mobile devices do not need a 2x framebuffer
    for every pixel.

    iPhone-sized screens use ~1.35x.
  */

  const pixelRatio=
    Math.min(
      devicePixelRatio||1,
      innerWidth<600
        ?1.35
        :1.75
    );

  renderer.setPixelRatio(
    pixelRatio
  );

  renderer.setSize(
    innerWidth,
    innerHeight,
    false
  );

  hudCanvas.width=
    Math.floor(
      innerWidth*
      pixelRatio
    );

  hudCanvas.height=
    Math.floor(
      innerHeight*
      pixelRatio
    );

  hudCanvas.style.width=
    innerWidth+
    'px';

  hudCanvas.style.height=
    innerHeight+
    'px';

  camera.aspect=
    innerWidth/
    innerHeight;

  camera.updateProjectionMatrix();

}

/* =========================================================
   UI
   ========================================================= */

function syncButtons(){

  if(!aircraft)
    return;

  const set=
    (id,on)=>
      document
        .getElementById(id)
        .classList
        .toggle(
          'on',
          !!on
        );

  set(
    'bGear',
    aircraft.gear>.5
  );

  set(
    'bFlap',
    aircraft.flaps>.5
  );

  set(
    'bBrk',
    aircraft.speedBrake>.5
  );

  set(
    'bAB',
    aircraft.afterburner
  );

  set(
    'bFBW',
    aircraft.fbw
  );

  document
    .getElementById(
      'thrFill'
    )
    .style.height=
      (
        aircraft.throttleTarget*
        100
      )+
      '%';

  document
    .getElementById(
      'thrKnob'
    )
    .style.bottom=
      (
        aircraft.throttleTarget*
        100
      )+
      '%';

}

function showToast(text){

  const e=
    document.getElementById(
      'toast'
    );

  e.textContent=text;
  e.style.opacity=1;

  clearTimeout(
    showToast.timer
  );

  showToast.timer=
    setTimeout(
      ()=>{
        e.style.opacity=0;
      },
      1200
    );

}

/* =========================================================
   TOUCH INPUT
   ========================================================= */

function setupTouchControls(){

  const zone=
    document.getElementById(
      'stickZone'
    );

  const base=
    document.getElementById(
      'stickBase'
    );

  const knob=
    document.getElementById(
      'stickKnob'
    );

  let stickID=null;

  let centerX=0;
  let centerY=0;

  zone.addEventListener(
    'pointerdown',
    e=>{

      e.preventDefault();

      stickID=
        e.pointerId;

      centerX=
        e.clientX;

      centerY=
        e.clientY;

      zone.setPointerCapture?.(
        stickID
      );

      base.style.display='block';
      knob.style.display='block';

      base.style.left=
        centerX+
        'px';

      base.style.top=
        centerY+
        'px';

      knob.style.left=
        centerX+
        'px';

      knob.style.top=
        centerY+
        'px';

    }
  );

  zone.addEventListener(
    'pointermove',
    e=>{

      if(
        e.pointerId!==stickID
      )
        return;

      let dx=
        e.clientX-
        centerX;

      let dy=
        e.clientY-
        centerY;

      const radius=65;

      const distance=
        Math.hypot(
          dx,
          dy
        );

      if(
        distance>radius
      ){

        dx*=
          radius/
          distance;

        dy*=
          radius/
          distance;

      }

      knob.style.left=
        centerX+
        dx+
        'px';

      knob.style.top=
        centerY+
        dy+
        'px';

      input.roll=
        clamp(
          dx/radius,
          -1,
          1
        );

      input.pitch=
        clamp(
          dy/radius,
          -1,
          1
        );

    }
  );

  const endStick=e=>{

    if(
      e.pointerId!==stickID
    )
      return;

    stickID=null;

    base.style.display='none';
    knob.style.display='none';

    input.pitch=0;
    input.roll=0;

  };

  zone.addEventListener(
    'pointerup',
    endStick
  );

  zone.addEventListener(
    'pointercancel',
    endStick
  );

  /* throttle */

  const throttleZone=
    document.getElementById(
      'thrZone'
    );

  const track=
    document.getElementById(
      'thrTrack'
    );

  function updateThrottle(y){

    const r=
      track.getBoundingClientRect();

    const value=
      clamp(
        1-
        (
          y-r.top
        )/
        r.height,
        0,
        1
      );

    aircraft.throttleTarget=
      value;

    syncButtons();

  }

  throttleZone.addEventListener(
    'pointerdown',
    e=>{

      throttleZone.setPointerCapture?.(
        e.pointerId
      );

      updateThrottle(
        e.clientY
      );

    }
  );

  throttleZone.addEventListener(
    'pointermove',
    e=>{

      if(
        e.buttons
      ){

        updateThrottle(
          e.clientY
        );

      }

    }
  );

  /* rudder */

  let rudderLeft=false;
  let rudderRight=false;

  function updateRudder(){

    input.yaw=
      (
        rudderLeft
        ?-1
        :0
      )+
      (
        rudderRight
        ?1
        :0
      );

  }

  function setupRudder(
    id,
    left
  ){

    const b=
      document.getElementById(
        id
      );

    b.addEventListener(
      'pointerdown',
      e=>{

        b.setPointerCapture?.(
          e.pointerId
        );

        if(left)
          rudderLeft=true;
        else
          rudderRight=true;

        updateRudder();

      }
    );

    const release=()=>{

      if(left)
        rudderLeft=false;
      else
        rudderRight=false;

      updateRudder();

    };

    b.addEventListener(
      'pointerup',
      release
    );

    b.addEventListener(
      'pointercancel',
      release
    );

    b.addEventListener(
      'pointerleave',
      release
    );

  }

  setupRudder(
    'bYawL',
    true
  );

  setupRudder(
    'bYawR',
    false
  );

}

/* =========================================================
   BUTTONS
   ========================================================= */

function setupButtons(){

  function click(
    id,
    fn
  ){

    document
      .getElementById(id)
      .addEventListener(
        'click',
        e=>{
          e.preventDefault();
          fn();
        }
      );

  }

  click(
    'bGear',
    ()=>{
      aircraft.gear=
        aircraft.gear>.5
        ?0
        :1;

      syncButtons();
    }
  );

  click(
    'bFlap',
    ()=>{
      aircraft.flaps=
        aircraft.flaps>.5
        ?0
        :1;

      syncButtons();
    }
  );

  click(
    'bBrk',
    ()=>{
      aircraft.speedBrake=
        aircraft.speedBrake>.5
        ?0
        :1;

      syncButtons();
    }
  );

  click(
    'bAB',
    ()=>{
      aircraft.afterburner=
        !aircraft.afterburner;

      syncButtons();
    }
  );

  click(
    'bFBW',
    ()=>{

      aircraft.fbw=
        !aircraft.fbw;

      syncButtons();

      showToast(
        aircraft.fbw
        ?'FBW: NORMAL LAW'
        :'FBW: DIRECT LAW'
      );

    }
  );

  click(
    'bView',
    ()=>{

      cameraMode=
        (
          cameraMode+1
        )%
        4;

      chaseInitialized=false;
      flybyInitialized=false;

      showToast(
        'CAMERA: '+
        cameraNames[
          cameraMode
        ]
      );

    }
  );

  click(
    'bRst',
    ()=>{
      resetAircraft();
    }
  );

  click(
    'bMenu',

      document
        .getElementById(
          'menu'
        )
        .style.display='block';
    }
  );

}

/* =========================================================
   KEYBOARD
   ========================================================= */

function setupKeyboard(){

  window.addEventListener(
    'keydown',
    e=>{

      keys[e.code]=true;

      if(
        [
          'Space',
          'ArrowUp',
          'ArrowDown',
          'ArrowLeft',
          'ArrowRight'
        ].includes(e.code)
      ){

        e.preventDefault();

      }

      if(e.repeat)
        return;

      if(
        e.code==='KeyG'
      ){

        aircraft.gear=
          aircraft.gear>.5
          ?0
          :1;

        syncButtons();

      }

      if(
        e.code==='KeyF'
      ){

        aircraft.flaps=
          aircraft.flaps>.5
          ?0
          :1;

        syncButtons();

      }

      if(
        e.code==='KeyB'
      ){

        aircraft.afterburner=
          !aircraft.afterburner;

        syncButtons();

      }

      if(
        e.code==='KeyX'
      ){

        aircraft.speedBrake=
          aircraft.speedBrake>.5
          ?0
          :1;

        syncButtons();

      }

      if(
        e.code==='KeyV'
      ){

        cameraMode=
          (
            cameraMode+1
          )%
          4;

        chaseInitialized=false;
        flybyInitialized=false;

      }

      if(
        e.code==='KeyP'
      ){

        aircraft.fbw=
          !aircraft.fbw;

        syncButtons();

      }

    }
  );

  window.addEventListener(
    'keyup',
    e=>{
      keys[e.code]=false;
    }
  );

}

function updateKeyboard(dt){

  /*
    Only keyboard input controls the axis when
    there isn't an active touch joystick.
  */

  if(
    keys.KeyW
  )
    input.pitch=-1;

  else if(
    keys.KeyS
  )
    input.pitch=1;

  else if(
    !('ontouchstart' in window)
  )
    input.pitch=0;


  if(
    keys.KeyA
  )
    input.roll=-1;

  else if(
    keys.KeyD
  )
    input.roll=1;

  else if(
    !('ontouchstart' in window)
  )
    input.roll=0;


  if(
    keys.KeyQ
  )
    input.yaw=-1;

  else if(
    keys.KeyE
  )
    input.yaw=1;


  input.brake=
    !!keys.Space;


  if(
    keys.ShiftLeft
  ){

    aircraft.throttleTarget=
      clamp(
        aircraft.throttleTarget+
        dt*.22,
        0,
        1
      );

  }

  if(
    keys.ControlLeft
  ){

    aircraft.throttleTarget=
      clamp(
        aircraft.throttleTarget-
        dt*.22,
        0,
        1
      );

  }

}

/* =========================================================
   AUDIO
   ========================================================= */

let audio=null;

function initAudio(){

  try{

    const AudioContext=
      window.AudioContext||
      window.webkitAudioContext;

    if(!AudioContext)
      return;

    const ctx=
      new AudioContext();

    const oscillator=
      ctx.createOscillator();

    const gain=
      ctx.createGain();

    const filter=
      ctx.createBiquadFilter();

    oscillator.type=
      'sawtooth';

    oscillator.frequency.value=
      70;

    filter.type=
      'lowpass';

    filter.frequency.value=
      900;

    gain.gain.value=
      .0001;

    oscillator
      .connect(filter)
      .connect(gain)
      .connect(ctx.destination);

    oscillator.start();

    audio={
      ctx,
      oscillator,
      gain,
      enabled:true
    };

    ctx.resume();

  }
  catch(e){

    console.warn(
      'Audio unavailable',
      e
    );

  }

}

function updateAudio(){

  if(!audio)
    return;

  const p=aircraft;

  audio.oscillator.frequency.value=
    55+
    p.throttle*170+
    (
      p.afterburner
      ?90
      :0
    );

  audio.gain.gain.value=
    audio.enabled
    ?(
      .008+
      p.throttle*.045
    )
    :0;

}

/* =========================================================
   MENU
   ========================================================= */

function buildMenu(){

  const grid=
    document.getElementById(
      'jetGrid'
    );

  JETS.forEach(
    (jet,index)=>{

      const card=
        document.createElement(
          'div'
        );

      card.className=
        'card'+
        (
          index===0
          ?' sel'
          :''
        );

      card.innerHTML=
        `
        <div class="nm">
          ${jet.name}
        </div>

        <div class="tag">
          ${jet.gen}
        </div>

        <div class="mt">
          MAX MACH ${jet.machMax.toFixed(2)}
          <br>
          EMPTY MASS
          ${jet.massEmpty.toLocaleString()}
          KG
          <br>
          ENGINES ${jet.engines}
          ${jet.tvc?' · TVC':''}
          ${jet.canard?' · CANARDS':''}
        </div>
        `;

      card.addEventListener(
        'click',
        ()=>{

          selectedJet=index;

          document
            .querySelectorAll(
              '.card'
            )
            .forEach(
              c=>
                c.classList.remove(
                  'sel'
                )
            );

          card.classList.add(
            'sel'
          );

          createAircraft();

        }
      );

      grid.appendChild(
        card
      );

    }
  );

  document
    .getElementById(
      'startBtn'
    )
    .addEventListener(
      'click',
      ()=>{

        simulationStarted=true;

        document
          .getElementById(
            'menu'
          )
          .style.display='none';

        if(!audio)
          initAudio();

        resetAircraft();

      }
    );

}

/* =========================================================
   MAIN LOOP
   ========================================================= */

let lastTime=
  performance.now();

let physicsAccumulator=0;

let hudAccumulator=0;

const FIXED_DT=
  1/120;

function frame(now){

  requestAnimationFrame(
    frame
  );

  /*
    Clamp giant frame gaps caused by
    backgrounding / app switching.
  */

  const frameTime=
    Math.min(
      .05,
      (now-lastTime)/1000
    );

  lastTime=now;

  if(
    simulationStarted &&
    !aircraft.crashed
  ){

    physicsAccumulator+=
      frameTime;

    updateKeyboard(
      frameTime
    );

    /*
      Fixed-step physics.

      Maximum six steps prevents a
      performance spiral on mobile.
    */

    let steps=0;

    while(
      physicsAccumulator>=
      FIXED_DT &&
      steps<6
    ){

      updateFlightDynamics(
        FIXED_DT
      );

      physicsAccumulator-=
        FIXED_DT;

      steps++;

    }

    updateAudio();

  }

  animateAircraft();

  updateCamera(
    frameTime
  );

  hudAccumulator+=
    frameTime;

  /*
    HUD at ~40 Hz instead of
    unnecessarily drawing it every
    physics iteration.
  */

  if(
    hudAccumulator>.025
  ){

    drawHUD();

    hudAccumulator=0;

  }

  renderer.render(
    scene,
    camera
  );

}

/* =========================================================
   ERROR HANDLING
   ========================================================= */

window.addEventListener(
  'error',
  e=>{

    const loading=
      document.getElementById(
        'loading'
      );

    loading.style.display='flex';

    loading.textContent=
      'VECTOR ERROR: '+
      e.message+
      ' | '+
      e.lineno+
      ':'+
      e.colno;

  }
);

window.addEventListener(
  'unhandledrejection',
  e=>{

    const loading=
      document.getElementById(
        'loading'
      );

    loading.style.display='flex';

    loading.textContent=
      'VECTOR ERROR: '+
      (
        e.reason?.message||
        e.reason||
        'Unhandled promise rejection'
      );

  }
);

/* =========================================================
   BOOT
   ========================================================= */

function boot(){

  hudCanvas=
    document.getElementById(
      'hud'
    );

  hudCtx=
    hudCanvas.getContext(
      '2d'
    );

  initScene();

  buildMenu();

  setupTouchControls();

  setupButtons();

  setupKeyboard();

  createAircraft();

  resize();

  document
    .getElementById(
      'loading'
    )
    .style.display='none';

  requestAnimationFrame(
    frame
  );

}

window.addEventListener(
  'resize',
  resize
);

document.addEventListener(
  'visibilitychange',
  ()=>{
    if(
      document.hidden &&
      audio?.ctx
    ){

      audio.ctx.suspend();

    }
    else if(
      !document.hidden &&
      audio?.ctx
    ){

      audio.ctx.resume();

    }
  }
);

boot();
