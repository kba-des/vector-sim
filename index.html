.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.card{background:linear-gradient(160deg,rgba(30,10,60,.85),rgba(10,4,26,.9));border:1px solid rgba(0,255,238,.35);border-radius:13px;padding:11px 11px 10px;position:relative;overflow:hidden;transition:.16s;}
.card:active{transform:scale(.965);}
.card.sel{background:linear-gradient(160deg,rgba(60,10,80,.95),rgba(20,4,40,.95));}
.card .nm{font-size:13px;font-weight:800;line-height:1.15;}
.card .mt{font-size:9px;letter-spacing:.15em;color:#9b6bc0;margin-top:5px;text-transform:uppercase;}
.card .gen{position:absolute;top:8px;right:8px;font-size:8px;font-weight:900;letter-spacing:.12em;padding:2.5px 5px;border-radius:5px;background:rgba(0,255,238,.15);color:#00ffee;border:1px solid rgba(0,255,238,.6);}
.card .gen.g45{background:rgba(255,0,170,.15);color:#ff55cc;border-color:rgba(255,0,170,.7);}
#startBtn{margin:22px 0 8px;padding:16px;border-radius:13px;text-align:center;font-size:15px;font-weight:900;letter-spacing:.28em;background:linear-gradient(90deg,#00ffee,#ff00aa);color:#050010;box-shadow:0 0 22px rgba(0,255,238,.55),0 0 44px rgba(255,0,170,.35);}
#startBtn:active{transform:scale(.98);}
.hint{text-align:center;font-size:10px;color:#a680c8;line-height:1.7;letter-spacing:.06em;margin-top:6px;}
#controls{position:absolute;inset:0;z-index:4;pointer-events:none;}
#stickBase{position:absolute;width:150px;height:150px;border-radius:50%;border:2px solid var(--accent);background:radial-gradient(circle,rgba(0,255,238,.08),rgba(255,0,170,.02));display:none;pointer-events:none;box-shadow:0 0 24px var(--accent);}
#stickKnob{position:absolute;width:60px;height:60px;border-radius:50%;border:2px solid var(--accent);background:radial-gradient(circle,rgba(255,0,170,.35),rgba(255,0,170,.06));display:none;pointer-events:none;box-shadow:0 0 20px var(--accent);}
#stickZone{position:absolute;left:0;bottom:0;width:52%;height:62%;pointer-events:auto;}
#thrZone{position:absolute;right:0;top:14%;width:96px;height:60%;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#thrTrack{position:relative;width:12px;height:78%;border-radius:6px;background:rgba(20,30,50,.7);border:1px solid var(--accent);box-shadow:0 0 12px var(--accent);}
#thrFill{position:absolute;bottom:0;left:0;width:100%;border-radius:6px;background:var(--accent);box-shadow:0 0 16px var(--accent);}
#thrKnob{position:absolute;left:50%;width:36px;height:20px;margin-left:-18px;border-radius:5px;background:var(--accent);border:2px solid var(--accent);box-shadow:0 0 18px var(--accent);bottom:0;transition:bottom .06s linear;}
#thrLbl{position:absolute;bottom:-22px;font-size:10px;letter-spacing:.20em;color:var(--accent);text-shadow:0 0 8px var(--accent);}
.btn{position:absolute;pointer-events:auto;border-radius:11px;border:1px solid var(--accent);background:rgba(5,10,26,.78);color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.10em;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);box-shadow:0 0 10px var(--accent);}
.btn:active,.btn.on{background:var(--accent);color:#050010;border-color:var(--accent);box-shadow:0 0 20px var(--accent);}
#bGear{right:calc(env(safe-area-inset-right) + 106px);bottom:calc(env(safe-area-inset-bottom) + 208px);width:52px;height:40px;}
#bFlap{right:calc(env(safe-area-inset-right) + 106px);bottom:calc(env(safe-area-inset-bottom) + 160px);width:52px;height:40px;}
#bBrk {right:calc(env(safe-area-inset-right) + 106px);bottom:calc(env(safe-area-inset-bottom) + 112px);width:52px;height:40px;}
#bAB  {right:calc(env(safe-area-inset-right) + 106px);bottom:calc(env(safe-area-inset-bottom) + 256px);width:52px;height:40px;}
#bView{right:calc(env(safe-area-inset-right) + 106px);bottom:calc(env(safe-area-inset-bottom) + 304px);width:52px;height:40px;}
#bRst {left:calc(env(safe-area-inset-left) + 14px);top:calc(env(safe-area-inset-top) + 12px);width:46px;height:34px;}
#bSnd {left:calc(env(safe-area-inset-left) + 68px);top:calc(env(safe-area-inset-top) + 12px);width:46px;height:34px;}
#bYawL{left:calc(env(safe-area-inset-left) + 14px);bottom:calc(env(safe-area-inset-bottom) + 22px);width:56px;height:46px;}
#bYawR{left:calc(env(safe-area-inset-left) + 80px);bottom:calc(env(safe-area-inset-bottom) + 22px);width:56px;height:46px;}
#msg{position:absolute;left:0;right:0;top:38%;text-align:center;z-index:6;pointer-events:none;font-size:22px;font-weight:900;letter-spacing:.24em;color:#ff00aa;text-shadow:0 0 20px #ff00aa,0 0 40px #ff00aa;display:none;}
#msg small{display:block;font-size:11px;letter-spacing:.15em;color:#ffaad4;margin-top:10px;font-weight:500;text-shadow:none;}
#fps{position:absolute;right:8px;top:calc(env(safe-area-inset-top) + 52px);font-size:9px;color:#5c3a8c;z-index:5;pointer-events:none;letter-spacing:.06em;}
#loading{position:absolute;inset:0;z-index:20;background:#05060e;display:flex;align-items:center;justify-content:center;color:#00ffee;font-size:12px;letter-spacing:.36em;text-shadow:0 0 14px #00ffee;}

// ---- noise helpers ----
function h2(x,y){var n=Math.sin(x*127.1+y*311.7)*43758.5453123;return n-Math.floor(n);}
function vn(x,y){
  var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  var u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  var a=h2(xi,yi),b=h2(xi+1,yi),c=h2(xi,yi+1),d=h2(xi+1,yi+1);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
}
function fbm(x,y,o){var s=0,a=0.5,f=1;for(var i=0;i<o;i++){s+=a*vn(x*f,y*f);f*=2.03;a*=0.5;}return s;}
function rid(x,y,o){var s=0,a=0.5,f=1;for(var i=0;i<o;i++){s+=a*(1-Math.abs(2*vn(x*f,y*f)-1));f*=2.07;a*=0.5;}return s;}

var FLAT_H=3.0;
function terrainH(x,z){
  var s=0.000070;
  var n1=fbm(x*s,z*s,6);
  var n2=rid(x*s*0.35+71.3,z*s*0.35-41.7,5);
  var h=(n1-0.48)*2400+h2(x*0.0001,z*0.0001)*20;
  h+=Math.pow(Math.max(0,n2-0.35),2.2)*9200;
  h-=180;
  var d=Math.sqrt(x*x+z*z);
  var b=smoothstep(5500,19000,d);
  return h*b+(1-b)*FLAT_H;
}
function terrainSlope(x,z){
  var e=60;
  var hL=terrainH(x-e,z),hR=terrainH(x+e,z);
  var hD=terrainH(x,z-e),hU=terrainH(x,z+e);
  return Math.min(1,Math.hypot(hR-hL,hU-hD)/(2*e)*2.2);
}

// ---- terrain detail texture ----
function makeTerrainTex(){
  var S=256;
  var c=document.createElement('canvas');c.width=S;c.height=S;
  var g=c.getContext('2d');
  var img=g.createImageData(S,S);
  for(var y=0;y<S;y++)for(var x=0;x<S;x++){
    var n1=fbm(x*0.08,y*0.08,4);
    var n2=vn(x*0.30,y*0.30);
    var n3=vn(x*1.1,y*1.1);
    var v=n1*0.55+n2*0.30+n3*0.15;
    var shade=Math.floor(155+v*100);
    var idx=(y*S+x)*4;
    img.data[idx]=shade;img.data[idx+1]=shade;img.data[idx+2]=shade;img.data[idx+3]=255;
  }
  g.putImageData(img,0,0);
  var tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(120,120);
  tex.anisotropy=8;
  return tex;
}

(function(){
  var T_SIZE=68000,T_SEG=210;
  var geo=new THREE.PlaneGeometry(T_SIZE,T_SIZE,T_SEG,T_SEG);
  geo.rotateX(-Math.PI/2);
  var pos=geo.attributes.position;
  var col=new Float32Array(pos.count*3);
  var cSand=new THREE.Color(0xbaa982),cGrass=new THREE.Color(0x4d6a3c),
      cForest=new THREE.Color(0x2e4a26),cRock=new THREE.Color(0x6a6058),
      cRockD=new THREE.Color(0x3e3630),cSnow=new THREE.Color(0xf0f4f8),
      cShore=new THREE.Color(0x8a9670);
  var tmp=new THREE.Color();
  for(var i=0;i<pos.count;i++){
    var x=pos.getX(i),z=pos.getZ(i);
    var h=terrainH(x,z);
    pos.setY(i,h);
    var slope=terrainSlope(x,z);
    var v=vn(x*0.0006,z*0.0006)*0.10-0.05;
    if(h<3) tmp.copy(cSand);
    else if(h<38) tmp.copy(cShore).lerp(cGrass,smoothstep(3,38,h));
    else if(h<420) tmp.copy(cGrass).lerp(cForest,smoothstep(50,420,h));
    else if(h<1300) tmp.copy(cForest).lerp(cRock,smoothstep(420,1300,h));
    else if(h<2100) tmp.copy(cRock).lerp(cSnow,smoothstep(1300,2100,h));
    else tmp.copy(cSnow);
    if(slope>0.35){
      var rockMix=Math.min(1,(slope-0.35)*1.8);
      tmp.lerp(h<1200?cRockD:cRock,rockMix);
    }
    tmp.offsetHSL(0,0,v);
    col[i*3]=tmp.r;col[i*3+1]=tmp.g;col[i*3+2]=tmp.b;
  }
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.computeVertexNormals();

  scene.add(mesh);
})();

// ---- jet builder ----
var PROFILE=[[0.000,0.015],[0.035,0.30],[0.090,0.60],[0.170,0.84],[0.275,0.965],[0.400,1.000],[0.540,0.985],[0.670,0.935],[0.790,0.865],[0.900,0.780],[1.000,0.690]];
function wingGeo(rc,tc,ss,sw,th,side){
  var s=new THREE.Shape();
  s.moveTo(0,0);s.lineTo(side*ss,sw);s.lineTo(side*ss,sw+tc);s.lineTo(0,rc);s.closePath();
  var g=new THREE.ExtrudeGeometry(s,{depth:th,bevelEnabled:true,bevelThickness:th*0.5,bevelSize:th*0.6,bevelSegments:1});
  g.rotateX(Math.PI/2);g.translate(0,th*0.5,0);return g;
}
function finGeo(rc,tc,h,sw,th){
  var s=new THREE.Shape();
  s.moveTo(0,0);s.lineTo(h,sw);s.lineTo(h,sw+tc);s.lineTo(0,rc);s.closePath();
  var g=new THREE.ExtrudeGeometry(s,{depth:th,bevelEnabled:true,bevelThickness:th*0.5,bevelSize:th*0.6,bevelSegments:1});
  g.rotateZ(-Math.PI/2);g.rotateY(Math.PI/2);return g;
}
function buildJet(cfg){
  var root=new THREE.Group();

  var darkMat=new THREE.MeshStandardMaterial({color:cfg.dark,metalness:0.85,roughness:0.35});
  var trimMat=new THREE.MeshBasicMaterial({color:cfg.trim});
  var trimGlow=new THREE.MeshBasicMaterial({color:cfg.trim,transparent:true,opacity:0.45,blending:THREE.AdditiveBlending,depthWrite:false});
  var glassMat=new THREE.MeshStandardMaterial({color:cfg.canopy?cfg.canopy.tint:0x1a2a3a,metalness:0.6,roughness:0.05,transparent:true,opacity:0.72,side:THREE.DoubleSide});
  var metalMat=new THREE.MeshStandardMaterial({color:0x8a9098,metalness:0.95,roughness:0.22});
  var intakeMat=new THREE.MeshStandardMaterial({color:0x14181e,metalness:0.75,roughness:0.5});
  var wingMat=new THREE.MeshStandardMaterial({color:cfg.color,metalness:0.75,roughness:0.42,side:THREE.DoubleSide});
  var lightR=new THREE.MeshBasicMaterial({color:0xff2222});
  var lightG=new THREE.MeshBasicMaterial({color:0x22ff44});
  var lightW=new THREE.MeshBasicMaterial({color:0xffffff});
  var L=cfg.L,R=cfg.R,zN=-L/2;
  var prof=PROFILE.map(function(p){return new THREE.Vector2(Math.max(0.03,p[1]*R),zN+p[0]*L);});
  var fg=new THREE.LatheGeometry(prof,32);
  fg.rotateX(Math.PI/2);fg.scale(1,0.86,1);
  root.add(new THREE.Mesh(fg,bodyMat));
  var strip=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.04,L*0.75),trimMat);
  strip.position.set(0,R*0.90,zN+L*0.50);root.add(strip);
  var rg=new THREE.CylinderGeometry(0.10*R,0.32*R,L*0.10,24);
  rg.rotateX(Math.PI/2);rg.translate(0,0,zN+L*0.045);
  root.add(new THREE.Mesh(rg,darkMat));
  if(cfg.canopy){
    var c=cfg.canopy;
    var cg=new THREE.SphereGeometry(1,24,16,0,Math.PI*2,0,Math.PI*0.56);
    cg.scale(c.r*1.02,c.r*0.96,c.len*0.5);
    var cm=new THREE.Mesh(cg,glassMat);
    cm.position.set(0,R*0.72,zN+c.f*L);root.add(cm);
    var frame=new THREE.Mesh(new THREE.TorusGeometry(c.r*0.95,0.035,c.r*0.8,20,Math.PI),trimMat);
    frame.position.set(0,R*0.60,zN+c.f*L-c.len*0.5);
    frame.rotation.y=Math.PI/2;frame.rotation.x=Math.PI/2;root.add(frame);
  }
  if(cfg.wing){
    var w=cfg.wing;
    for(var si=0;si<2;si++){var side=si===0?1:-1;
      var g=wingGeo(w.root,w.tip,w.span,w.sweep,w.thick,side);
      var m=new THREE.Mesh(g,wingMat);
      m.position.set(0,w.y||0,zN+w.f*L);root.add(m);
      var le=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.05,w.span*1.02),trimMat);
      le.position.set(side*w.span*0.5,(w.y||0)+w.thick*0.55,zN+w.f*L-w.root*0.10);
      le.rotation.y=-side*Math.atan2(w.sweep,w.span);root.add(le);
      var tg=new THREE.Mesh(new THREE.SphereGeometry(0.18,8,6),trimGlow);
      tg.position.set(side*w.span*1.02,(w.y||0)+0.08,zN+w.f*L+w.sweep+w.tip*0.55);
      root.add(tg);
      var lg=new THREE.Mesh(new THREE.SphereGeometry(0.11,6,4),side>0?lightG:lightR);
      lg.position.copy(tg.position);root.add(lg);
      // missile rail
      var rail=new THREE.Mesh(new THREE.BoxGeometry(0.10,0.10,w.tip*0.75),new THREE.MeshStandardMaterial({color:cfg.dark,metalness:0.9,roughness:0.3}));
      rail.position.set(side*w.span*0.94,(w.y||0)-0.10,zN+w.f*L+w.sweep+w.tip*0.40);
      root.add(rail);
    }
  }
  if(cfg.canard){
    var cd=cfg.canard;
    for(var si2=0;si2<2;si2++){var sd2=si2===0?1:-1;
      var g2=wingGeo(cd.root,cd.tip,cd.span,cd.sweep,cd.thick,sd2);
      var m2=new THREE.Mesh(g2,wingMat);
      m2.position.set(0,cd.y||0,zN+cd.f*L);m2.rotation.z=sd2*0.06;
      root.add(m2);
    }
  }
  if(cfg.htail){
    var h=cfg.htail;
    for(var si3=0;si3<2;si3++){var sd3=si3===0?1:-1;
      var g3=wingGeo(h.root,h.tip,h.span,h.sweep,h.thick,sd3);
      var m3=new THREE.Mesh(g3,wingMat);
      m3.position.set(0,h.y||0,zN+h.f*L);root.add(m3);
    }
  }
  if(cfg.vtail){
    var v=cfg.vtail;
    var positions=v.count===2?[v.x,-v.x]:[0];
    for(var vi=0;vi<positions.length;vi++){
      var px=positions[vi];
      var g4=finGeo(v.root,v.tip,v.h,v.sweep,v.thick);
      var m4=new THREE.Mesh(g4,wingMat);
      m4.position.set(px,0,zN+v.f*L);
      m4.rotation.z=(px>0?-1:1)*v.cant;root.add(m4);

    flame.position.set(px2,0,L/2+L*0.28);root.add(flame);
    var gc=document.createElement('canvas');gc.width=128;gc.height=128;
    var gg=gc.getContext('2d');

    grd.addColorStop(0,'rgba(255,255,255,0.95)');

    glow.scale.set(L*0.9,L*0.9,1);glow.position.set(px2,0,L/2+L*0.20);root.add(glow);

  }

  // ---- Landing gear ----
  var gearGroup=new THREE.Group();

  var wheelMat=new THREE.MeshStandardMaterial({color:0x0a0a0a,metalness:0.3,roughness:0.85});

var audio=null,audioReady=false,soundOn=true;
function initAudio(){
  if(audioReady) return;
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    audio=new AC();
    var master=audio.createGain();master.gain.value=0.0;master.connect(audio.destination);
    var o1=audio.createOscillator();o1.type='sawtooth';o1.frequency.value=70;
    var o2=audio.createOscillator();o2.type='square';o2.frequency.value=104;
    var og=audio.createGain();og.gain.value=0.12;
    var lp=audio.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;lp.Q.value=3;
    o1.connect(og);o2.connect(og);og.connect(lp);lp.connect(master);
    var len=audio.sampleRate*2;
    var buf=audio.createBuffer(1,len,audio.sampleRate);
    var ch=buf.getChannelData(0);
    for(var i=0;i<len;i++) ch[i]=Math.random()*2-1;
    var ns=audio.createBufferSource();ns.buffer=buf;ns.loop=true;
    var nf=audio.createBiquadFilter();nf.type='bandpass';nf.frequency.value=420;nf.Q.value=0.7;
    var ng=audio.createGain();ng.gain.value=0.0;
    ns.connect(nf);nf.connect(ng);ng.connect(master);
    o1.start();o2.start();ns.start();
    audio._m=master;audio._o1=o1;audio._o2=o2;audio._og=og;audio._lp=lp;audio._ng=ng;audio._nf=nf;
    audioReady=true;
  }catch(e){}
}
function updateAudio(){
  if(!audioReady||!audio) return;
  audio._m.gain.setTargetAtTime(soundOn?0.5:0.0,audio.currentTime,0.12);
  var thr=player.throttle;
  var f=62+thr*95+(player.ab?38:0);
  audio._o1.frequency.setTargetAtTime(f,audio.currentTime,0.09);
  audio._o2.frequency.setTargetAtTime(f*1.51,audio.currentTime,0.09);
  audio._og.gain.setTargetAtTime(0.06+thr*0.20+(player.ab?0.08:0),audio.currentTime,0.14);
  audio._lp.frequency.setTargetAtTime(700+thr*2200+(player.ab?1400:0),audio.currentTime,0.14);
  var wind=clamp(player.ias/260,0,1);
  audio._ng.gain.setTargetAtTime(wind*wind*0.30,audio.currentTime,0.16);
  audio._nf.frequency.setTargetAtTime(300+wind*900,audio.currentTime,0.16);
}

// ---- physics ----
var _fwd=new THREE.Vector3(),_up=new THREE.Vector3(),_rgt=new THREE.Vector3();
var _inv=new THREE.Quaternion(),_vLoc=new THREE.Vector3();
var _vDir=new THREE.Vector3(),_liftDir=new THREE.Vector3(),_F=new THREE.Vector3();
var _acc=new THREE.Vector3(),_dq=new THREE.Quaternion(),_eul=new THREE.Euler();

function physics(dt){
  var p=player,sp=p.spec;
  _fwd.set(0,0,-1).applyQuaternion(p.quat);
  _up.set(0,1,0).applyQuaternion(p.quat);
  _rgt.set(1,0,0).applyQuaternion(p.quat);
  var alt=p.pos.y;
  var rho=1.225*Math.pow(Math.max(0.045,1-2.25577e-5*alt),4.25588);
  _inv.copy(p.quat).invert();
  _vLoc.copy(p.vel).applyQuaternion(_inv);
  var V=p.vel.length();
  var Vf=Math.max(0.5,-_vLoc.z);
  var alpha=Math.atan2(-_vLoc.y,Vf);
  var beta=Math.atan2(_vLoc.x,Vf);
  var mach=V/340.3;
  p.mach=mach;p.alpha=alpha;p.beta=beta;
  p.aoaDeg=alpha*R2D;
  p.ias=V*Math.sqrt(rho/1.225)*1.94384;
  var q=0.5*rho*V*V;
  var machT=smoothstep(0.88,1.35,mach);
  var CLa=sp.CLa*(1-0.34*machT);
  var aStall=sp.aStall*(1-0.22*machT);
  aStall*=(1-0.10*p.flaps);
  var CL=CLa*alpha+0.32*p.flaps;
  var aa=Math.abs(alpha);
  if(aa>aStall){var k=1-0.62*Math.min(1,(aa-aStall)/0.32);CL*=k;}
  var liftF=q*sp.area*CL;
  var CD=sp.cd0+(CL*CL)/(Math.PI*sp.AR*0.82);
  CD+=0.021*p.gear+0.017*p.flaps+0.055*p.brake;
  CD+=0.018*smoothstep(0.95,1.18,mach)+0.050*smoothstep(1.18,1.65,mach);
  if(aa>aStall)CD+=0.55*Math.pow(Math.sin(Math.min(aa-aStall,1.0)),2);
  CD+=0.10*Math.abs(beta);
  var dragF=q*sp.area*CD;
  var mass=sp.mass*(0.72+0.28*p.fuel);
  var abWanted=p.ab&&p.throttle>0.92;
  var Tmax=abWanted?sp.Tab:sp.Td;
  var thrust=p.throttle*Tmax*Math.pow(rho/1.225,0.85)*(1-0.24*smoothstep(1.15,2.20,mach));
  _vDir.copy(p.vel);
  if(V>0.2)_vDir.multiplyScalar(1/V);else _vDir.set(0,0,-1);
  _liftDir.copy(_up).addScaledVector(_vDir,-_up.dot(_vDir));
  if(_liftDir.lengthSq()<1e-6)_liftDir.copy(_up);
  _liftDir.normalize();
  _F.set(0,0,0);
  _F.addScaledVector(_liftDir,liftF);
  _F.addScaledVector(_vDir,-dragF);
  _F.addScaledVector(_fwd,thrust);
  _F.addScaledVector(_rgt,-q*sp.area*0.85*Math.sin(beta));
  _F.y-=mass*9.81;
  _acc.copy(_F).divideScalar(mass);
  _acc.y+=9.81;
  p.g=clamp(_acc.dot(_up)/9.81,-6,14);
  _acc.copy(_F).divideScalar(mass);
  p.vel.addScaledVector(_acc,dt);
  p.pos.addScaledVector(p.vel,dt);
  var qRef=0.5*1.225*70*70;
  var auth=clamp(q/qRef,0,1.15);
  if(V<8)auth=Math.max(auth,V/12);
  var pitchCmd=input.pitch;
  if(V<70&&!p.onGround)pitchCmd*=0.55;
  var aLim=sp.aStall*1.05;
  if(pitchCmd>0&&Math.abs(alpha)>aLim*0.94){pitchCmd*=Math.max(0,1-(Math.abs(alpha)-aLim*0.94)/(aLim*0.5));}
  if(pitchCmd>0&&p.g>sp.gLim*0.96){pitchCmd*=Math.max(0,1-(p.g-sp.gLim*0.96)/(sp.gLim*0.7));}
  var tPitch=pitchCmd*sp.pRate*auth;
  var tRoll=-input.roll*sp.rRate*auth;
  var tYaw=-input.yaw*sp.yRate*auth;
  if(aa>aStall){
    var sv=Math.min(1,(aa-aStall)/0.35);
    p.stallT=Math.min(1,p.stallT+dt*2);
    tPitch+=(Math.random()-0.5)*2.4*sv;
    tRoll+=(Math.random()-0.5)*5.0*sv;
    tYaw+=(Math.random()-0.5)*1.6*sv;
    tRoll+=sv*1.8*Math.sign(alpha||1);
  }else p.stallT=Math.max(0,p.stallT-dt*1.2);
  tRoll*=(1-0.35*Math.min(1,aa/0.7));
  var rateLerp=1-Math.exp(-dt*(7.5-auth*1.5));
  p.rates.x=lerp(p.rates.x,tPitch,rateLerp);
  p.rates.y=lerp(p.rates.y,tYaw,rateLerp);
  p.rates.z=lerp(p.rates.z,tRoll,rateLerp);
  var gh=gearHeight();
  var gy=terrainH(p.pos.x,p.pos.z)+gh;
  var onGround=false;
  if(p.pos.y<=gy+0.02&&p.gear>0.9){
    if(p.vel.y<=0.05){
      onGround=true;
      var impact=-p.vel.y;
      if(impact>11)crash('HARD LANDING');
      p.pos.y=gy;p.vel.y=0;
      var hdg=Math.atan2(-_fwd.x,-_fwd.z);
      var steerSpd=clamp(V/22,0,1);
      hdg-=input.yaw*0.85*dt*(1-steerSpd*0.4);
      if(Math.abs(p.pos.x)>26&&V<30)p.pos.x=clamp(p.pos.x,-26,26);
      var rotSpd=smoothstep(120,150,p.ias);
      var autoRot=0;
      if(p.takeoffAssist&&p.ias>135&&p.ias<170&&p.throttle>0.5)autoRot=0.16;
      var pitchTarget=(clamp(pitchCmd,0,1)+autoRot)*0.24*rotSpd;
      p.quat.setFromEuler(_eul.set(pitchTarget,hdg,0,'YXZ'));
      p.rates.set(0,0,0);
      var roll=0.018+(input.brake?0.55:0)+(p.brake*0.4);
      var sp2=p.vel.length();
      if(sp2>0.01){
        var dec=Math.min(sp2,roll*9.81*dt*(1+sp2*0.02));
        p.vel.multiplyScalar(Math.max(0,1-dec/Math.max(sp2,0.001)));
      }
      if(V>1){
        var yawRate=input.yaw*1.1*dt*(V<12?1:12/V);
        var cs=Math.cos(yawRate),sn=Math.sin(yawRate);
        var vx=p.vel.x,vz=p.vel.z;
        p.vel.x=vx*cs+vz*sn;p.vel.z=-vx*sn+vz*cs;
      }
    }else p.pos.y=gy;
  }else if(p.pos.y<gy-0.5&&p.gear<=0.9){
    if(p.pos.y<terrainH(p.pos.x,p.pos.z)+1.2)crash('GEAR UP — BELLY LANDING');
  }else if(p.pos.y<terrainH(p.pos.x,p.pos.z)+0.6)crash('TERRAIN IMPACT');
  p.onGround=onGround;
  if(!onGround){
    _dq.setFromEuler(_eul.set(p.rates.x*dt,p.rates.y*dt,p.rates.z*dt,'XYZ'));
    p.quat.multiply(_dq).normalize();
    p.flightTime+=dt;
  }
  p.throttle=lerp(p.throttle,p.thrTarget,1-Math.exp(-dt*1.9));
  var burn=(0.0016+p.throttle*0.0072)*(abWanted?2.5:1)*dt;
  p.fuel=Math.max(0,p.fuel-burn);
  if(p.fuel<=0)p.throttle=lerp(p.throttle,0,1-Math.exp(-dt*1.2));
  p.brake=input.brake?1:0;
  p.abGlow=lerp(p.abGlow,(abWanted&&p.throttle>0.9)?1:0,1-Math.exp(-dt*7));
  var gExcess=Math.max(0,p.g-sp.gLim*0.98);
  p.gLoadT=clamp(p.gLoadT+(gExcess*0.35-0.8)*dt,0,1.4);
  p.heading=((-Math.atan2(-_fwd.x,-_fwd.z)*R2D)+360)%360;
}
function crash(reason){
  if(player.crashed)return;
  player.crashed=true;
  var m=document.getElementById('msg');
  m.innerHTML='CRASH<small>'+reason+' — TAP RST TO RESPAWN</small>';
  m.style.display='block';
  player.vel.multiplyScalar(0.15);
}

function updateCamera(dt){
  var p=player;
  if(!p.model)return;
  _fwd.set(0,0,-1).applyQuaternion(p.quat);
  _up.set(0,1,0).applyQuaternion(p.quat);
  if(camState.mode===0){
    var off=new THREE.Vector3(0,p.cfg.R*0.72,-p.cfg.L*0.10).applyQuaternion(p.quat);
    camera.position.copy(p.pos).add(off);
    camera.quaternion.copy(p.quat);
    camera.fov=74;
  }else if(camState.mode===1){
    var dist=p.cfg.L*1.9+9;
    var desired=p.pos.clone().addScaledVector(_fwd,-dist).addScaledVector(_up,p.cfg.L*0.45+3);
    if(!camState.chaseInit){camState.chasePos.copy(desired);camState.chaseInit=true;}
    var lag=1-Math.exp(-dt*4.5);
    camState.chasePos.lerp(desired,lag);
    camera.position.copy(camState.chasePos);
    camera.lookAt(p.pos.clone().addScaledVector(_fwd,p.cfg.L*0.9).addScaledVector(_up,1));
    camera.fov=64;
  }else{
    var d=camState.orbitDist;
    var yaw=camState.orbitYaw,pit=camState.orbitPitch;
    camera.position.set(p.pos.x+Math.sin(yaw)*Math.cos(pit)*d,p.pos.y+Math.sin(pit)*d,p.pos.z+Math.cos(yaw)*Math.cos(pit)*d);
    camera.lookAt(p.pos);
    camera.fov=58;
    camState.orbitYaw+=dt*0.10;
  }
  camera.updateProjectionMatrix();
  p.model.position.copy(p.pos);
  p.model.quaternion.copy(p.quat);
  for(var i=0;i<p.nozzles.length;i++){
    var n=p.nozzles[i];
    n.flame.material.opacity=p.abGlow*(0.75+Math.random()*0.20);
    n.glow.material.opacity=p.abGlow*0.85;
    var s=0.7+p.abGlow*1.15;
    n.flame.scale.set(s,1,s);
    n.glow.scale.set(1.0+p.abGlow*1.3,1.0+p.abGlow*1.3,1);
  }
  if(p.gearGroup){
    var tgt=p.gear>0.5?1:0;
    var cur=p.gearGroup.scale.y;
    p.gearGroup.scale.y=lerp(cur,tgt,1-Math.exp(-dt*3.5));
  }
  key.target.position.copy(p.pos);
  key.position.copy(p.pos).addScaledVector(sunDir,900);
  key.target.updateMatrixWorld();
  if(oceanNorm) oceanNorm.offset.set(performance.now()*0.00003,performance.now()*0.000045);
  if(thrKnobEl){
    thrKnobEl.style.bottom=Math.round(player.throttle*100)+'%';
    thrKnobEl.style.transform='translateY(50%)';
  }
  if(thrFillEl){
    thrFillEl.style.height=Math.round(player.throttle*100)+'%';
  }
}

var HW=0,HH=0,HDPR=1;
function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
  HDPR=Math.min(window.devicePixelRatio||1,2);
  hudCv.width=Math.floor(w*HDPR);hudCv.height=Math.floor(h*HDPR);
  hudCv.style.width=w+'px';hudCv.style.height=h+'px';
  ctx.setTransform(HDPR,0,0,HDPR,0,0);
  HW=w;HH=h;
}
addEventListener('resize',resize);
addEventListener('orientationchange',function(){setTimeout(resize,220);});

var MAGENTA='#ff00aa';
function drawHUD(){
  var w=HW,h=HH;
  ctx.clearRect(0,0,w,h);
  var p=player;
  if(!state.running||!p.model)return;
  var accent='#'+p.cfg.trim.toString(16).padStart(6,'0');
  var cx=w*0.5,cy=h*0.46;
  var ppd=(h/72)*1.02;
  _fwd.set(0,0,-1).applyQuaternion(p.quat);
  _up.set(0,1,0).applyQuaternion(p.quat);
  _rgt.set(1,0,0).applyQuaternion(p.quat);
  var pitch=Math.asin(clamp(_fwd.y,-1,1));
  var bank=Math.atan2(-_rgt.y,_up.y);
  _inv.copy(p.quat).invert();
  _vLoc.copy(p.vel).applyQuaternion(_inv);

  ctx.save();
  ctx.lineWidth=1.8;ctx.strokeStyle=accent;ctx.fillStyle=accent;
  ctx.font='700 11px -apple-system,Helvetica,Arial';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor=accent;ctx.shadowBlur=8;
  ctx.save();
  ctx.beginPath();
  var R=Math.min(w,h)*0.40;
  ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();
  ctx.translate(cx,cy);ctx.rotate(-bank);
  var pDeg=pitch*R2D;
  for(var a=-90;a<=90;a+=5){
    if(a===0)continue;
    if(Math.abs(a-pDeg)>38)continue;
    var y=(pDeg-a)*ppd;
    var wide=(a%10===0);
    var half=(wide?52:26);
    ctx.beginPath();
    if(a<0)ctx.setLineDash([7,7]);else ctx.setLineDash([]);
    ctx.moveTo(-half,y);ctx.lineTo(-half*0.34,y);
    ctx.moveTo(half*0.34,y);ctx.lineTo(half,y);
    ctx.stroke();
    ctx.setLineDash([]);
    if(wide){ctx.fillText(Math.abs(a),-half-16,y);ctx.fillText(Math.abs(a),half+16,y);}
  }
  var hy=pDeg*ppd;
  ctx.setLineDash([]);ctx.lineWidth=2.4;
  ctx.beginPath();
  ctx.moveTo(-R,hy);ctx.lineTo(-72,hy);
  ctx.moveTo(72,hy);ctx.lineTo(R,hy);
  ctx.stroke();
  ctx.lineWidth=1.8;
  ctx.restore();
  var fpmX=cx+Math.atan2(_vLoc.x,Math.max(0.5,-_vLoc.z))*ppd;
  var fpmY=cy-Math.atan2(_vLoc.y,Math.max(0.5,-_vLoc.z))*ppd;
  if(Math.hypot(fpmX-cx,fpmY-cy)<R*1.05){
    ctx.beginPath();ctx.arc(fpmX,fpmY,7,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(fpmX-16,fpmY);ctx.lineTo(fpmX-7,fpmY);
    ctx.moveTo(fpmX+7,fpmY);ctx.lineTo(fpmX+16,fpmY);
    ctx.moveTo(fpmX,fpmY-7);ctx.lineTo(fpmX,fpmY-16);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(cx-26,cy);ctx.lineTo(cx-9,cy);
  ctx.moveTo(cx+9,cy);ctx.lineTo(cx+26,cy);
  ctx.moveTo(cx,cy-9);ctx.lineTo(cx,cy-2);
  ctx.stroke();

  drawTape(cx-w*0.36,cy,Math.round(p.ias),'KTS',1,true,accent);
  drawTape(cx+w*0.36,cy,Math.round(p.pos.y*3.28084),'FT',10,false,accent);

  ctx.textAlign='center';
  var hdg=p.heading,hw2=w*0.30;
  ctx.beginPath();
  ctx.moveTo(cx-hw2,cy-h*0.30);ctx.lineTo(cx+hw2,cy-h*0.30);
  ctx.stroke();
  for(var d=-60;d<=60;d+=10){
    var hd=(Math.round(hdg/10)*10+d+360)%360;
    var px=cx+((hd-hdg+540)%360-180)*(hw2/60);
    if(Math.abs(px-cx)>hw2)continue;
    var tall=hd%30===0;
    ctx.beginPath();
    ctx.moveTo(px,cy-h*0.30);ctx.lineTo(px,cy-h*0.30+(tall?9:5));
    ctx.stroke();
    if(tall)ctx.fillText((hd/10).toString().padStart(2,'0'),px,cy-h*0.30-12);
  }
  ctx.fillText(Math.round(hdg).toString().padStart(3,'0'),cx,cy-h*0.30-30);
  ctx.beginPath();
  ctx.moveTo(cx,cy-h*0.30+3);ctx.lineTo(cx-5,cy-h*0.30+12);ctx.lineTo(cx+5,cy-h*0.30+12);
  ctx.closePath();ctx.fill();

  ctx.textAlign='left';
  var bx=cx-w*0.36,by=h-h*0.24;
  ctx.font='700 12px -apple-system,Helvetica,Arial';
  ctx.fillText('MACH',bx,by);
  ctx.font='800 22px -apple-system,Helvetica,Arial';
  ctx.fillText(p.mach.toFixed(2),bx,by+24);
  ctx.font='700 12px -apple-system,Helvetica,Arial';
  ctx.fillText('G',bx,by+50);
  ctx.font='800 22px -apple-system,Helvetica,Arial';
  ctx.fillText(p.g.toFixed(1),bx,by+74);
  ctx.font='700 12px -apple-system,Helvetica,Arial';
  ctx.fillText('AOA',bx+86,by+50);
  ctx.font='800 22px -apple-system,Helvetica,Arial';
  ctx.fillText(p.aoaDeg.toFixed(0)+'°',bx+86,by+74);
  ctx.font='700 12px -apple-system,Helvetica,Arial';
  ctx.fillText('V/S',bx,by+102);
  ctx.font='800 18px -apple-system,Helvetica,Arial';
  var vs=Math.round(p.vel.y*196.85);
  ctx.fillText((vs>=0?'+':'')+vs,bx+38,by+102);

  ctx.textAlign='right';
  var rx=cx+w*0.36;
  ctx.font='700 12px -apple-system,Helvetica,Arial';
  ctx.fillText('THR',rx,by);
  ctx.font='800 22px -apple-system,Helvetica,Arial';
  ctx.fillText(Math.round(p.throttle*100)+'%',rx,by+24);
  ctx.font='700 12px -apple-system,Helvetica,Arial';
  ctx.fillText('FUEL',rx,by+50);
  ctx.font='800 22px -apple-system,Helvetica,Arial';
  ctx.fillStyle=p.fuel<0.15?MAGENTA:accent;
  ctx.fillText(Math.round(p.fuel*100)+'%',rx,by+74);
  ctx.fillStyle=accent;
  ctx.font='700 12px -apple-system,Helvetica,Arial';
  ctx.fillText('HDG',rx,by+102);
  ctx.font='800 18px -apple-system,Helvetica,Arial';
  ctx.fillText(Math.round(p.heading).toString().padStart(3,'0'),rx,by+102);

  var tbW=10,tbH=150,tbX=rx-tbW,tbY=by+126;
  ctx.strokeRect(tbX,tbY,tbW,tbH);
  ctx.fillStyle=MAGENTA;
  ctx.fillRect(tbX+1,tbY+tbH*(1-p.throttle),tbW-2,tbH*p.throttle);
  ctx.fillStyle=accent;

  ctx.textAlign='center';
  ctx.font='800 13px -apple-system,Helvetica,Arial';
  var sy=h-h*0.13,sx=cx-110;
  var flags=[];
  if(p.gear>0.5)flags.push(['GEAR',accent]);
  if(p.flaps>0.5)flags.push(['FLAP',accent]);
  if(p.brake>0.5)flags.push(['BRAKE',MAGENTA]);
  if(p.onGround)flags.push(['GND',MAGENTA]);
  for(var fi=0;fi<flags.length;fi++){ctx.fillStyle=flags[fi][1];ctx.fillText(flags[fi][0],sx,sy);sx+=62;}

  if(Math.abs(p.aoaDeg)>p.spec.aStall*R2D*0.88&&p.stallT<0.5){
    if(Math.floor(performance.now()/250)%2===0){
      ctx.fillStyle=MAGENTA;ctx.font='900 22px -apple-system,Helvetica,Arial';
      ctx.shadowColor=MAGENTA;ctx.fillText('STALL',cx,cy+h*0.30);
    }
  }
  if(p.stallT>0.5){
    ctx.fillStyle=MAGENTA;ctx.font='900 24px -apple-system,Helvetica,Arial';
    ctx.fillText('STALL',cx,cy+h*0.30);
  }
  if(Math.abs(p.g)>p.spec.gLim){
    ctx.fillStyle=MAGENTA;ctx.font='900 18px -apple-system,Helvetica,Arial';
    ctx.fillText('OVER-G',cx,cy+h*0.34);
  }
  if(p.vaporAmt>0.3){
    ctx.fillStyle='rgba(255,255,255,'+(p.vaporAmt*0.6)+')';
    ctx.font='700 12px -apple-system,Helvetica,Arial';
    ctx.fillText('TRANSONIC',cx,cy-h*0.32);
  }
  if(p.gLoadT>0.05){
    var ga=Math.min(0.9,p.gLoadT*0.75);
    var grd=ctx.createRadialGradient(cx,cy,h*0.10,cx,cy,h*0.62);
    grd.addColorStop(0,'rgba(0,0,0,0)');
    grd.addColorStop(1,'rgba(0,0,0,'+ga+')');
    ctx.fillStyle=grd;ctx.fillRect(0,0,w,h);
  }
  if(p.g<-1.5){
    var ga2=Math.min(0.7,(-p.g-1.5)*0.16);
    ctx.fillStyle='rgba(120,0,80,'+ga2+')';
    ctx.fillRect(0,0,w,h);
  }
  ctx.shadowBlur=0;
  ctx.textAlign='left';
  ctx.fillStyle=MAGENTA;
  ctx.font='700 10px -apple-system,Helvetica,Arial';
  ctx.fillText('VIEW: '+VIEWS[camState.mode],12,h-26);
  ctx.fillStyle=accent;
  ctx.fillText(p.cfg.name.toUpperCase()+'  ·  '+p.cfg.gen+(p.cfg.gen==='5'?'TH GEN':' GEN'),12,h-14);
  ctx.restore();
}
function drawTape(x,cy,val,label,step,isLeft,accent){
  var H=150;
  var pxPerUnit=isLeft?1.15:0.085;
  ctx.save();
  ctx.strokeStyle=accent;ctx.fillStyle=accent;
  ctx.lineWidth=1.8;
  ctx.font='700 11px -apple-system,Helvetica,Arial';
  ctx.textAlign=isLeft?'right':'left';
  ctx.textBaseline='middle';
  var boxX=isLeft?x-58:x;
  ctx.strokeRect(boxX,cy-28,58,56);
  ctx.font='800 22px -apple-system,Helvetica,Arial';
  ctx.fillText(Math.abs(val).toString().padStart(isLeft?3:5,'0'),isLeft?x-8:x+8,cy);
  ctx.font='700 9px -apple-system,Helvetica,Arial';
  ctx.fillText(label,isLeft?x-8:x+8,cy+20);
  ctx.font='600 10px -apple-system,Helvetica,Arial';
  var range=H/pxPerUnit;
  var start=Math.floor((val-range)/step)*step;
  for(var v=start;v<=val+range;v+=step){
    var dy=(val-v)*pxPerUnit;
    if(Math.abs(dy)>H)continue;
    var y=cy+dy;
    var major=(Math.round(v/step)%5===0);
    var len=major?10:6;
    ctx.beginPath();
    if(isLeft){ctx.moveTo(x-64,y);ctx.lineTo(x-64-len,y);}
    else{ctx.moveTo(x+64,y);ctx.lineTo(x+64+len,y);}
    ctx.stroke();
    if(major)ctx.fillText(v.toString(),isLeft?x-80:x+80,y);
  }
  ctx.restore();
}

var fpsAcc=0,fpsN=0,fpsT=0;
var fpsEl=document.getElementById('fps');
function loop(now){
  requestAnimationFrame(loop);
  var dt=(now-lastT)/1000;
  lastT=now;
  if(dt>0.1)dt=0.1;
  if(dt<=0)dt=0.016;
  fpsAcc+=dt;fpsN++;fpsT+=dt;
  if(fpsT>0.6){fpsEl.textContent=Math.round(fpsN/fpsAcc)+' FPS';fpsAcc=0;fpsN=0;fpsT=0;}
  if(state.running&&!player.crashed){
    keyboardInput();
    var steps=dt>0.025?2:1;
    for(var i=0;i<steps;i++)physics(dt/steps);
    updateAudio();
    updateVapor(dt);
    trailTimer+=dt;
    if(trailTimer>0.04 && player.ias>110 && !player.onGround){
      trailTimer=0;
      _fwd.set(0,0,-1).applyQuaternion(player.quat);
      _rgt.set(1,0,0).applyQuaternion(player.quat);
      var wing=player.cfg.wing?player.cfg.wing.span:5;
      var l=player.pos.clone().addScaledVector(_rgt,-wing).addScaledVector(_fwd,-player.cfg.L*0.1);
      var r=player.pos.clone().addScaledVector(_rgt,wing).addScaledVector(_fwd,-player.cfg.L*0.1);
      var trim=player.cfg.trim;
      var rr=(trim>>16)&255,gg=(trim>>8)&255,bb=trim&255;
      var comp=((0xff-rr)<<16)|((0xff-gg)<<8)|(0xff-bb);
      spawnTrail(l,trim,3,0.55);
      spawnTrail(r,comp,3,0.55);
      // engine trails
      var eXs=player.cfg.engines===2?[player.cfg.eX,-player.cfg.eX]:[0];
      for(var e=0;e<eXs.length;e++){
        var ex=eXs[e];
        var ep=player.pos.clone().addScaledVector(_rgt,ex).addScaledVector(_fwd,-player.cfg.L*0.55);
        spawnTrail(ep,player.cfg.exh,2,0.45);
      }
    }
  }else if(player.model){
    player.model.position.copy(player.pos);
    player.model.quaternion.copy(player.quat);
  }
  updateTrails(dt);
  if(player.model)updateCamera(dt);
  renderer.render(scene,camera);
  drawHUD();
}

resize();
requestAnimationFrame(function(t){lastT=t;loop(t);});
setTimeout(function(){loading.style.display='none';},400);
document.addEventListener('touchmove',function(e){if(e.target.closest('#menu'))return;e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
})();
