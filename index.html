  .card.sel{background:linear-gradient(160deg,rgba(60,10,80,.95),rgba(20,4,40,.95));}
  .card .nm{font-size:13px;font-weight:800;line-height:1.15;}
  .card .mt{font-size:9px;letter-spacing:.15em;color:#9b6bc0;margin-top:5px;text-transform:uppercase;}
  .card .gen{position:absolute;top:8px;right:8px;font-size:8px;font-weight:900;letter-spacing:.12em;padding:2.5px 5px;border-radius:5px;background:rgba(0,255,238,.15);color:#00ffee;border:1px solid rgba(0,255,238,.6);}

  #startBtn:active{transform:scale(.98);}
  .hint{text-align:center;font-size:10px;color:#a680c8;line-height:1.7;letter-spacing:.06em;margin-top:6px;}
  #controls{position:absolute;inset:0;z-index:4;pointer-events:none;}
  #stickBase{position:absolute;width:150px;height:150px;border-radius:50%;border:2px solid var(--accent);background:radial-gradient(circle,rgba(0,255,238,.08),rgba(255,0,170,.02));display:none;pointer-events:none;box-shadow:0 0 24px var(--accent);}
  #stickKnob{position:absolute;width:60px;height:60px;border-radius:50%;border:2px solid var(--accent);background:radial-gradient(circle,rgba(255,0,170,.35),rgba(255,0,170,.06));display:none;pointer-events:none;box-shadow:0 0 20px var(--accent);}

const canvas=document.getElementById('gl');

const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.toneMapping=THREE.ACESFilmicToneMapping;

const scene=new THREE.Scene();
/* FIX 3: bluer fog, lower density */
scene.fog=new THREE.FogExp2(0x8fa8c4,0.000025);

const camera=new THREE.PerspectiveCamera(70,1,0.5,400000);
/* FIX 3: sun higher in the sky (55 deg up), less pink wash */
const sunDir=new THREE.Vector3(-0.35,0.55,0.75).normalize();

scene.add(new THREE.HemisphereLight(0x90b0d0,0x40503a,0.60));
/* FIX 3: cool white key light, lower intensity */
const key=new THREE.DirectionalLight(0xfff2e0,1.4);
key.position.copy(sunDir).multiplyScalar(1000);
key.castShadow=true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.near=200;
key.shadow.camera.far=4000;
key.shadow.camera.left=-300;
key.shadow.camera.right=300;
key.shadow.camera.top=300;
key.shadow.camera.bottom=-300;
key.shadow.bias=-0.0007;
key.shadow.normalBias=0.6;
scene.add(key);
scene.add(key.target);
const fill=new THREE.DirectionalLight(0x88aaff,0.35);
fill.position.set(0.6,-0.2,-0.6).multiplyScalar(1000);
scene.add(fill);

        else if(h<0.20) c=mix(low,hor,smoothstep(0.0,0.20,h));

        else c=mix(mid,top,smoothstep(0.55,1.0,h));
        float sd=dot(normalize(vW),normalize(sunDir));
        c+=sunCol*pow(max(sd,0.0),30.0)*0.75;
        c+=sunCol*pow(max(sd,0.0),4.0)*0.18;
        gl_FragColor=vec4(c,1.0);
      }`
  });
  scene.add(new THREE.Mesh(skyGeo,skyMat));
})();

/* ================= TERRAIN ================= */
function hash2(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453123;return n-Math.floor(n);}
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
}
function fbm(x,y,oct){let s=0,amp=0.5,f=1;for(let i=0;i<oct;i++){s+=amp*vnoise(x*f,y*f);f*=2.03;amp*=0.5;}return s;}
function ridged(x,y,oct){let s=0,amp=0.5,f=1;for(let i=0;i<oct;i++){s+=amp*(1-Math.abs(2*vnoise(x*f,y*f)-1));f*=2.07;amp*=0.5;}return s;}

const FLAT_H=3.0;
function terrainH(x,z){
  const s=0.000070;
  const n1=fbm(x*s,z*s,6);
  const n2=ridged(x*s*0.35+71.3,z*s*0.35-41.7,5);
  let h=(n1-0.48)*2400;
  h+=Math.pow(Math.max(0,n2-0.35),2.2)*9200;
  h-=180;
  const d=Math.sqrt(x*x+z*z);
  const b=smoothstep(5500,19000,d);
  return h*b+(1-b)*FLAT_H;
}
function terrainSlope(x,z){
  const e=60;
  const hL=terrainH(x-e,z),hR=terrainH(x+e,z);
  const hD=terrainH(x,z-e),hU=terrainH(x,z+e);
  return Math.min(1,Math.hypot(hR-hL,hU-hD)/(2*e)*2.2);
}

(function buildTerrain(){
  const T_SIZE=68000,T_SEG=210;
  const geo=new THREE.PlaneGeometry(T_SIZE,T_SIZE,T_SEG,T_SEG);
  geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;
  const col=new Float32Array(pos.count*3);
  /* realistic biome colors */
  const cSand=new THREE.Color(0xbaa982),cGrass=new THREE.Color(0x4d6a3c),
        cForest=new THREE.Color(0x2e4a26),cRock=new THREE.Color(0x6a6058),
        cRockD=new THREE.Color(0x3e3630),cSnow=new THREE.Color(0xf0f4f8),
        cShore=new THREE.Color(0x8a9670);
  const tmp=new THREE.Color();
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getZ(i);
    const h=terrainH(x,z);
    pos.setY(i,h);
    const slope=terrainSlope(x,z);
    const v=vnoise(x*0.0006,z*0.0006)*0.10-0.05;
    if(h<3) tmp.copy(cSand);
    else if(h<38) tmp.copy(cShore).lerp(cGrass,smoothstep(3,38,h));
    else if(h<420) tmp.copy(cGrass).lerp(cForest,smoothstep(50,420,h));
    else if(h<1300) tmp.copy(cForest).lerp(cRock,smoothstep(420,1300,h));
    else if(h<2100) tmp.copy(cRock).lerp(cSnow,smoothstep(1300,2100,h));
    else tmp.copy(cSnow);
    if(slope>0.35){
      const rockMix=Math.min(1,(slope-0.35)*1.8);
      tmp.lerp(h<1200?cRockD:cRock,rockMix);
    }
    tmp.offsetHSL(0,0,v);
    col[i*3]=tmp.r;col[i*3+1]=tmp.g;col[i*3+2]=tmp.b;
  }
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.95,metalness:0.0});
  /* Neon grid baked into terrain shader (fixes flicker) */
  mat.onBeforeCompile=(shader)=>{
    shader.vertexShader='varying vec3 vWPos;\n'+shader.vertexShader.replace(
      '#include <worldpos_vertex>',
      '#include <worldpos_vertex>\nvWPos=(modelMatrix*vec4(position,1.0)).xyz;'
    );
    shader.fragmentShader='varying vec3 vWPos;\n'+shader.fragmentShader.replace(
      '#include <dithering_fragment>',
      `#include <dithering_fragment>
       float gs=500.0;
       vec2 gW=vWPos.xz/gs;
       vec2 gf=abs(fract(gW)-0.5)*2.0;
       float lx=smoothstep(0.94,1.0,gf.x);
       float ly=smoothstep(0.94,1.0,gf.y);
       float line=max(lx,ly);
       float dCam=length(vWPos-cameraPosition);
       float fade=1.0-smoothstep(1500.0,6500.0,dCam);
       gl_FragColor.rgb+=vec3(0.0,1.0,0.93)*line*fade*0.55;
      `
    );
  };
  const mesh=new THREE.Mesh(geo,mat);
  mesh.receiveShadow=true;
  scene.add(mesh);
})();

const DEFAULT_PROFILE=[[0.000,0.015],[0.035,0.30],[0.090,0.60],[0.170,0.84],[0.275,0.965],[0.400,1.000],[0.540,0.985],[0.670,0.935],[0.790,0.865],[0.900,0.780],[1.000,0.690]];
function wingGeo(rootChord,tipChord,semiSpan,sweep,thick,side){
  const s=new THREE.Shape();
  s.moveTo(0,0); s.lineTo(side*semiSpan,sweep); s.lineTo(side*semiSpan,sweep+tipChord); s.lineTo(0,rootChord); s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth:thick,bevelEnabled:true,bevelThickness:thick*0.5,bevelSize:thick*0.6,bevelSegments:1,curveSegments:1});
  g.rotateX(Math.PI/2); g.translate(0,thick*0.5,0); return g;
}
function finGeo(rootChord,tipChord,height,sweep,thick){
  const s=new THREE.Shape();
  s.moveTo(0,0); s.lineTo(height,sweep); s.lineTo(height,sweep+tipChord); s.lineTo(0,rootChord); s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth:thick,bevelEnabled:true,bevelThickness:thick*0.5,bevelSize:thick*0.6,bevelSegments:1,curveSegments:1});
  g.rotateZ(-Math.PI/2); g.rotateY(Math.PI/2); return g;
}

    const gMat=new THREE.SpriteMaterial({map:gTex,transparent:true,opacity:0.0,blending:THREE.AdditiveBlending,depthWrite:false,color:cfg.exh});
    const glow=new THREE.Sprite(gMat);
    glow.scale.set(L*0.9,L*0.9,1);
    glow.position.set(px,0,L/2+L*0.20);
    root.add(glow);
    nozzles.push({flame:flame,glow:glow});
  }
  if(eCount===2){
    for(const px of [1,-1]){
      const ig=new THREE.BoxGeometry(0.55*R,0.62*R,L*0.16);
      const im=new THREE.Mesh(ig,intakeMat);
      im.position.set(px*(cfg.eX+0.45),-0.22*R,zN+L*0.36);

    }

    const ig=new THREE.CylinderGeometry(0.48*R,0.52*R,L*0.10,20);
    ig.rotateX(Math.PI/2);
    const im=new THREE.Mesh(ig,intakeMat);
    im.position.set(0,-0.42*R,zN+L*0.30);
    root.add(im);
  }
  return {group:root,nozzles:nozzles};
}

let audio=null,audioReady=false,soundOn=true;
function initAudio(){
  if(audioReady) return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    audio=new AC();
    const master=audio.createGain(); master.gain.value=0.0; master.connect(audio.destination);
    const osc1=audio.createOscillator(); osc1.type='sawtooth'; osc1.frequency.value=70;
    const osc2=audio.createOscillator(); osc2.type='square'; osc2.frequency.value=104;
    const og=audio.createGain(); og.gain.value=0.12;
    const lp=audio.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; lp.Q.value=3;
    osc1.connect(og); osc2.connect(og); og.connect(lp); lp.connect(master);
    const len=audio.sampleRate*2;
    const buf=audio.createBuffer(1,len,audio.sampleRate);
    const ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=Math.random()*2-1;
    const noise=audio.createBufferSource(); noise.buffer=buf; noise.loop=true;
    const nf=audio.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=420; nf.Q.value=0.7;
    const ng=audio.createGain(); ng.gain.value=0.0;
    noise.connect(nf); nf.connect(ng); ng.connect(master);
    osc1.start(); osc2.start(); noise.start();
    Object.assign(audio,{_m:master,_o1:osc1,_o2:osc2,_og:og,_lp:lp,_ng:ng,_nf:nf});
    audioReady=true;
  }catch(e){}
}
function updateAudio(){
  if(!audioReady||!audio) return;
  const tgt=soundOn?0.5:0.0;
  audio._m.gain.setTargetAtTime(tgt,audio.currentTime,0.12);
  const thr=player.throttle;
  const f=62+thr*95+(player.ab?38:0);
  audio._o1.frequency.setTargetAtTime(f,audio.currentTime,0.09);
  audio._o2.frequency.setTargetAtTime(f*1.51,audio.currentTime,0.09);
  audio._og.gain.setTargetAtTime(0.06+thr*0.20+(player.ab?0.08:0),audio.currentTime,0.14);
  audio._lp.frequency.setTargetAtTime(700+thr*2200+(player.ab?1400:0),audio.currentTime,0.14);
  const wind=clamp(player.ias/260,0,1);
  audio._ng.gain.setTargetAtTime(wind*wind*0.30,audio.currentTime,0.16);
  audio._nf.frequency.setTargetAtTime(300+wind*900,audio.currentTime,0.16);
}

/* ================= PHYSICS ================= */
const _fwd=new THREE.Vector3(),_up=new THREE.Vector3(),_rgt=new THREE.Vector3();
const _inv=new THREE.Quaternion(),_vLoc=new THREE.Vector3();
const _vDir=new THREE.Vector3(),_liftDir=new THREE.Vector3(),_F=new THREE.Vector3();
const _acc=new THREE.Vector3(),_dq=new THREE.Quaternion(),_eul=new THREE.Euler();

function physics(dt){
  const p=player,sp=p.spec;
  _fwd.set(0,0,-1).applyQuaternion(p.quat);
  _up.set(0,1,0).applyQuaternion(p.quat);
  _rgt.set(1,0,0).applyQuaternion(p.quat);
  const alt=p.pos.y;
  const rho=1.225*Math.pow(Math.max(0.045,1-2.25577e-5*alt),4.25588);
  _inv.copy(p.quat).invert();
  _vLoc.copy(p.vel).applyQuaternion(_inv);
  const V=p.vel.length();
  const Vf=Math.max(0.5,-_vLoc.z);
  const alpha=Math.atan2(-_vLoc.y,Vf);
  const beta=Math.atan2(_vLoc.x,Vf);
  const mach=V/340.3;
  p.mach=mach;p.alpha=alpha;p.beta=beta;
  p.aoaDeg=alpha*R2D;
  p.ias=V*Math.sqrt(rho/1.225)*1.94384;
  const q=0.5*rho*V*V;
  const machT=smoothstep(0.88,1.35,mach);
  let CLa=sp.CLa*(1-0.34*machT);
  let aStall=sp.aStall*(1-0.22*machT);
  aStall*=(1-0.10*p.flaps);
  let CL=CLa*alpha+0.32*p.flaps;
  const aa=Math.abs(alpha);
  if(aa>aStall){const k=1-0.62*Math.min(1,(aa-aStall)/0.32);CL*=k;}
  const liftF=q*sp.area*CL;
  let CD=sp.cd0+(CL*CL)/(Math.PI*sp.AR*0.82);
  CD+=0.021*p.gear+0.017*p.flaps+0.055*p.brake;
  CD+=0.018*smoothstep(0.95,1.18,mach)+0.050*smoothstep(1.18,1.65,mach);
  if(aa>aStall)CD+=0.55*Math.pow(Math.sin(Math.min(aa-aStall,1.0)),2);
  CD+=0.10*Math.abs(beta);
  const dragF=q*sp.area*CD;
  const mass=sp.mass*(0.72+0.28*p.fuel);
  const abWanted=p.ab&&p.throttle>0.92;
  const Tmax=abWanted?sp.Tab:sp.Td;
  let thrust=p.throttle*Tmax;
  thrust*=Math.pow(rho/1.225,0.85);
  thrust*=(1-0.24*smoothstep(1.15,2.20,mach));
  _vDir.copy(p.vel);
  if(V>0.2)_vDir.multiplyScalar(1/V);else _vDir.set(0,0,-1);
  _liftDir.copy(_up).addScaledVector(_vDir,-_up.dot(_vDir));
  if(_liftDir.lengthSq()<1e-6)_liftDir.copy(_up);
  _liftDir.normalize();
  _F.set(0,0,0);
  _F.addScaledVector(_liftDir,liftF);
  _F.addScaledVector(_vDir,-dragF);
  _F.addScaledVector(_fwd,thrust);
  _F.addScaledVector(_rgt,-q*sp.area*0.85*Math.sin(beta));
  _F.y-=mass*9.81;
  _acc.copy(_F).divideScalar(mass);
  _acc.y+=9.81;
  p.g=clamp(_acc.dot(_up)/9.81,-6,14);
  _acc.copy(_F).divideScalar(mass);
  p.vel.addScaledVector(_acc,dt);
  p.pos.addScaledVector(p.vel,dt);
  const qRef=0.5*1.225*70*70;
  let auth=clamp(q/qRef,0,1.15);
  if(V<8)auth=Math.max(auth,V/12);
  let pitchCmd=input.pitch;
  if(V<70&&!p.onGround)pitchCmd*=0.55;
  const aLim=sp.aStall*1.05;
  if(pitchCmd>0&&Math.abs(alpha)>aLim*0.94){pitchCmd*=Math.max(0,1-(Math.abs(alpha)-aLim*0.94)/(aLim*0.5));}
  if(pitchCmd>0&&p.g>sp.gLim*0.96){pitchCmd*=Math.max(0,1-(p.g-sp.gLim*0.96)/(sp.gLim*0.7));}
  let tPitch=pitchCmd*sp.pRate*auth;
  let tRoll=-input.roll*sp.rRate*auth;
  let tYaw=-input.yaw*sp.yRate*auth;
  if(aa>aStall){
    const sv=Math.min(1,(aa-aStall)/0.35);
    p.stallT=Math.min(1,p.stallT+dt*2);
    tPitch+=(Math.random()-0.5)*2.4*sv;
    tRoll+=(Math.random()-0.5)*5.0*sv;
    tYaw+=(Math.random()-0.5)*1.6*sv;
    tRoll+=sv*1.8*Math.sign(alpha||1);
  }else p.stallT=Math.max(0,p.stallT-dt*1.2);
  tRoll*=(1-0.35*Math.min(1,aa/0.7));
  const rateLerp=1-Math.exp(-dt*(7.5-auth*1.5));
  p.rates.x=lerp(p.rates.x,tPitch,rateLerp);
  p.rates.y=lerp(p.rates.y,tYaw,rateLerp);
  p.rates.z=lerp(p.rates.z,tRoll,rateLerp);
  const gh=gearHeight();
  const gy=terrainH(p.pos.x,p.pos.z)+gh;
  let onGround=false;
  if(p.pos.y<=gy+0.02&&p.gear>0.9){
    if(p.vel.y<=0.05){
      onGround=true;
      const impact=-p.vel.y;
      if(impact>11)crash('HARD LANDING');
      p.pos.y=gy;p.vel.y=0;
      let hdg=Math.atan2(-_fwd.x,-_fwd.z);
      const steerSpd=clamp(V/22,0,1);
      hdg-=input.yaw*0.85*dt*(1-steerSpd*0.4);
      if(Math.abs(p.pos.x)>26&&V<30)p.pos.x=clamp(p.pos.x,-26,26);
      const rotSpd=smoothstep(120,150,p.ias);
      let autoRot=0;
      if(p.takeoffAssist&&p.ias>135&&p.ias<170&&p.throttle>0.5)autoRot=0.16;
      const pitchTarget=(clamp(pitchCmd,0,1)+autoRot)*0.24*rotSpd;
      p.quat.setFromEuler(_eul.set(pitchTarget,hdg,0,'YXZ'));
      p.rates.set(0,0,0);
      const roll=0.018+(input.brake?0.55:0)+(p.brake*0.4);
      const sp2=p.vel.length();
      if(sp2>0.01){
        const dec=Math.min(sp2,roll*9.81*dt*(1+sp2*0.02));
        p.vel.multiplyScalar(Math.max(0,1-dec/Math.max(sp2,0.001)));
      }
      if(V>1){
        const yawRate=input.yaw*1.1*dt*(V<12?1:12/V);
        const cs=Math.cos(yawRate),sn=Math.sin(yawRate);
        const vx=p.vel.x,vz=p.vel.z;
        p.vel.x=vx*cs+vz*sn;p.vel.z=-vx*sn+vz*cs;
      }
    }else p.pos.y=gy;
  }else if(p.pos.y<gy-0.5&&p.gear<=0.9){
    if(p.pos.y<terrainH(p.pos.x,p.pos.z)+1.2)crash('GEAR UP — BELLY LANDING');
  }else if(p.pos.y<terrainH(p.pos.x,p.pos.z)+0.6)crash('TERRAIN IMPACT');
  p.onGround=onGround;
  if(!onGround){
    _dq.setFromEuler(_eul.set(p.rates.x*dt,p.rates.y*dt,p.rates.z*dt,'XYZ'));
    p.quat.multiply(_dq).normalize();
    p.flightTime+=dt;
  }
  p.throttle=lerp(p.throttle,p.thrTarget,1-Math.exp(-dt*1.9));
  const burn=(0.0016+p.throttle*0.0072)*(abWanted?2.5:1)*dt;
  p.fuel=Math.max(0,p.fuel-burn);
  if(p.fuel<=0)p.throttle=lerp(p.throttle,0,1-Math.exp(-dt*1.2));
  p.brake=input.brake?1:0;
  p.abGlow=lerp(p.abGlow,(abWanted&&p.throttle>0.9)?1:0,1-Math.exp(-dt*7));
  const gExcess=Math.max(0,p.g-sp.gLim*0.98);
  p.gLoadT=clamp(p.gLoadT+(gExcess*0.35-0.8)*dt,0,1.4);
  p.heading=((-Math.atan2(-_fwd.x,-_fwd.z)*R2D)+360)%360;
}
function crash(reason){
  if(player.crashed)return;
  player.crashed=true;
  const m=document.getElementById('msg');
  m.innerHTML='CRASH<small>'+reason+' — TAP RST TO RESPAWN</small>';
  m.style.display='block';
  player.vel.multiplyScalar(0.15);
}

/* ================= CAMERA ================= */
function updateCamera(dt){
  const p=player;
  if(!p.model)return;
  _fwd.set(0,0,-1).applyQuaternion(p.quat);
  _up.set(0,1,0).applyQuaternion(p.quat);
  if(camState.mode===0){
    const off=new THREE.Vector3(0,p.cfg.R*0.72,-p.cfg.L*0.10).applyQuaternion(p.quat);
    camera.position.copy(p.pos).add(off);
    camera.quaternion.copy(p.quat);
    camera.fov=74;
  }else if(camState.mode===1){
    const dist=p.cfg.L*1.9+9;
    const desired=p.pos.clone().addScaledVector(_fwd,-dist).addScaledVector(_up,p.cfg.L*0.45+3);
    if(!camState.chaseInit){camState.chasePos.copy(desired);camState.chaseInit=true;}
    const lag=1-Math.exp(-dt*4.5);
    camState.chasePos.lerp(desired,lag);
    camera.position.copy(camState.chasePos);
    camera.lookAt(p.pos.clone().addScaledVector(_fwd,p.cfg.L*0.9).addScaledVector(_up,1));
    camera.fov=64;
  }else{
    const d=camState.orbitDist;
    const yaw=camState.orbitYaw,pit=camState.orbitPitch;
    camera.position.set(p.pos.x+Math.sin(yaw)*Math.cos(pit)*d,p.pos.y+Math.sin(pit)*d,p.pos.z+Math.cos(yaw)*Math.cos(pit)*d);
    camera.lookAt(p.pos);
    camera.fov=58;
    camState.orbitYaw+=dt*0.10;
  }
  camera.updateProjectionMatrix();
  p.model.position.copy(p.pos);
  p.model.quaternion.copy(p.quat);
  for(const n of p.nozzles){
    n.flame.material.opacity=p.abGlow*(0.75+Math.random()*0.20);
    n.glow.material.opacity=p.abGlow*0.85;
    const s=0.7+p.abGlow*1.15;
    n.flame.scale.set(s,1,s);
    n.glow.scale.set(1.0+p.abGlow*1.3,1.0+p.abGlow*1.3,1);
  }
  key.target.position.copy(p.pos);
  key.position.copy(p.pos).addScaledVector(sunDir,900);
  key.target.updateMatrixWorld();
}

/* ================= HUD ================= */
let HW=0,HH=0,HDPR=1;
function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
  HDPR=Math.min(window.devicePixelRatio||1,2);
  hudCv.width=Math.floor(w*HDPR);hudCv.height=Math.floor(h*HDPR);
  hudCv.style.width=w+'px';hudCv.style.height=h+'px';
  ctx.setTransform(HDPR,0,0,HDPR,0,0);
  HW=w;HH=h;
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,220));

const MAGENTA='#ff00aa';
function drawHUD(){
  const w=HW,h=HH;
  ctx.clearRect(0,0,w,h);
  const p=player;
  if(!state.running||!p.model)return;
  const accent='#'+p.cfg.trim.toString(16).padStart(6,'0');
  const cx=w*0.5,cy=h*0.46;
  const ppd=(h/72)*1.02;
  _fwd.set(0,0,-1).applyQuaternion(p.quat);
  _up.set(0,1,0).applyQuaternion(p.quat);
  _rgt.set(1,0,0).applyQuaternion(p.quat);
  const pitch=Math.asin(clamp(_fwd.y,-1,1));
  const bank=Math.atan2(-_rgt.y,_up.y);
  _inv.copy(p.quat).invert();
  _vLoc.copy(p.vel).applyQuaternion(_inv);

  ctx.save();
  ctx.lineWidth=1.8;ctx.strokeStyle=accent;ctx.fillStyle=accent;
  ctx.font='700 11px -apple-system,Helvetica,Arial';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor=accent;ctx.shadowBlur=8;
  ctx.save();
  ctx.beginPath();
  const R=Math.min(w,h)*0.40;
  ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();
  ctx.translate(cx,cy);ctx.rotate(-bank);
  const pDeg=pitch*R2D;
  for(let a=-90;a<=90;a+=5){
    if(a===0)continue;
    if(Math.abs(a-pDeg)>38)continue;
    const y=(pDeg-a)*ppd;
    const wide=(a%10===0);
    const half=(wide?52:26);
    ctx.beginPath();
    if(a<0)ctx.setLineDash([7,7]);else ctx.setLineDash([]);
    ctx.moveTo(-half,y);ctx.lineTo(-half*0.34,y);
    ctx.moveTo(half*0.34,y);ctx.lineTo(half,y);
    ctx.stroke();
    ctx.setLineDash([]);
    if(wide){ctx.fillText(Math.abs(a),-half-16,y);ctx.fillText(Math.abs(a),half+16,y);}
  }
  const hy=pDeg*ppd;
  ctx.setLineDash([]);ctx.lineWidth=2.4;
  ctx.beginPath();
  ctx.moveTo(-R,hy);ctx.lineTo(-72,hy);
  ctx.moveTo(72,hy);ctx.lineTo(R,hy);
  ctx.stroke();
  ctx.lineWidth=1.8;
  ctx.restore();
  const fpmX=cx+Math.atan2(_vLoc.x,Math.max(0.5,-_vLoc.z))*ppd;
  const fpmY=cy-Math.atan2(_vLoc.y,Math.max(0.5,-_vLoc.z))*ppd;
  if(Math.hypot(fpmX-cx,fpmY-cy)<R*1.05){
    ctx.beginPath();ctx.arc(fpmX,fpmY,7,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(fpmX-16,fpmY);ctx.lineTo(fpmX-7,fpmY);
    ctx.moveTo(fpmX+7,fpmY);ctx.lineTo(fpmX+16,fpmY);
    ctx.moveTo(fpmX,fpmY-7);ctx.lineTo(fpmX,fpmY-16);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(cx-26,cy);ctx.lineTo(cx-9,cy);
  ctx.moveTo(cx+9,cy);ctx.lineTo(cx+26,cy);
  ctx.moveTo(cx,cy-9);ctx.lineTo(cx,cy-2);
  ctx.stroke();

  drawTape(cx-w*0.36,cy,Math.round(p.ias),'KTS',1,true,accent);
  drawTape(cx+w*0.36,cy,Math.round(p.pos.y*3.28084),'FT',10,false,accent);

  ctx.textAlign='center';
  const hdg=p.heading,hw2=w*0.30;
  ctx.beginPath();
  ctx.moveTo(cx-hw2,cy-h*0.30);ctx.lineTo(cx+hw2,cy-h*0.30);
  ctx.stroke();
  for(let d=-60;d<=60;d+=10){
    const hd=(Math.round(hdg/10)*10+d+360)%360;
    const px=cx+((hd-hdg+540)%360-180)*(hw2/60);
    if(Math.abs(px-cx)>hw2)continue;
    const tall=hd%30===0;
    ctx.beginPath();
    ctx.moveTo(px,cy-h*0.30);ctx.lineTo(px,cy-h*0.30+(tall?9:5));
    ctx.stroke();
    if(tall)ctx.fillText((hd/10).toString().padStart(2,'0'),px,cy-h*0.30-12);
  }
  ctx.fillText(Math.round(hdg).toString().padStart(3,'0'),cx,cy-h*0.30-30);
  ctx.beginPath();
  ctx.moveTo(cx,cy-h*0.30+3);ctx.lineTo(cx-5,cy-h*0.30+12);ctx.lineTo(cx+5,cy-h*0.30+12);
  ctx.closePath();ctx.fill();

  ctx.textAlign='left';
  const bx=cx-w*0.36,by=h-h*0.24;
  ctx.font='700 12px -apple-system,Helvetica,Arial';
  ctx.fillText('MACH',bx,by);
  ctx.font='800 22px -apple-system,Helvetica,Arial';
  ctx.fillText(p.mach.toFixed(2),bx,by+24);

  ctx.font='700 12px -apple-system,Helvetica,Arial';
  ctx.fillText('G',bx,by+50);
  ctx.font='800 22px -apple-system,Helvetica,Arial';
  ctx.fillText(p.g.toFixed(1),bx,by+74);

  ctx.font='700 12px -apple-system,Helvetica,Arial';
  ctx.fillText('AOA',bx+86,by+50);
  ctx.font='800 22px -apple-system,Helvetica,Arial';
  ctx.fillText(p.aoaDeg.toFixed(0)+'°',bx+86,by+74);

  ctx.font='700 12px -apple-system,Helvetica,Arial';
  ctx.fillText('V/S',bx,by+102);
  ctx.font='800 18px -apple-system,Helvetica,Arial';
  const vs=Math.round(p.vel.y*196.85);
  ctx.fillText((vs>=0?'+':'')+vs,bx+38,by+102);

  ctx.textAlign='right';
  const rx=cx+w*0.36;
  ctx.font='700 12px -apple-system,Helvetica,Arial';
  ctx.fillText('THR',rx,by);
  ctx.font='800 22px -apple-system,Helvetica,Arial';
  ctx.fillText(Math.round(p.throttle*100)+'%',rx,by+24);

  ctx.font='700 12px -apple-system,Helvetica,Arial';
  ctx.fillText('FUEL',rx,by+50);
  ctx.font='800 22px -apple-system,Helvetica,Arial';
  ctx.fillStyle=p.fuel<0.15?MAGENTA:accent;
  ctx.fillText(Math.round(p.fuel*100)+'%',rx,by+74);
  ctx.fillStyle=accent;

  ctx.font='700 12px -apple-system,Helvetica,Arial';
  ctx.fillText('HDG',rx,by+102);
  ctx.font='800 18px -apple-system,Helvetica,Arial';
  ctx.fillText(Math.round(p.heading).toString().padStart(3,'0'),rx,by+102);

  const tbW=10,tbH=150,tbX=rx-tbW,tbY=by+126;
  ctx.strokeRect(tbX,tbY,tbW,tbH);
  ctx.fillStyle=MAGENTA;
  ctx.fillRect(tbX+1,tbY+tbH*(1-p.throttle),tbW-2,tbH*p.throttle);
  ctx.fillStyle=accent;

  ctx.textAlign='center';
  ctx.font='800 13px -apple-system,Helvetica,Arial';
  const sy=h-h*0.13;
  let sx=cx-110;
  const flags=[];
  if(p.gear>0.5)flags.push(['GEAR',accent]);
  if(p.flaps>0.5)flags.push(['FLAP',accent]);
  if(p.brake>0.5)flags.push(['BRAKE',MAGENTA]);
  if(p.onGround)flags.push(['GND',MAGENTA]);
  flags.forEach(f=>{ctx.fillStyle=f[1];ctx.fillText(f[0],sx,sy);sx+=62;});

  if(Math.abs(p.aoaDeg)>p.spec.aStall*R2D*0.88&&p.stallT<0.5){
    if(Math.floor(performance.now()/250)%2===0){
      ctx.fillStyle=MAGENTA;
      ctx.font='900 22px -apple-system,Helvetica,Arial';
      ctx.shadowColor=MAGENTA;
      ctx.fillText('STALL',cx,cy+h*0.30);
    }
  }
  if(p.stallT>0.5){
    ctx.fillStyle=MAGENTA;
    ctx.font='900 24px -apple-system,Helvetica,Arial';
    ctx.fillText('STALL',cx,cy+h*0.30);
  }
  if(Math.abs(p.g)>p.spec.gLim){
    ctx.fillStyle=MAGENTA;
    ctx.font='900 18px -apple-system,Helvetica,Arial';
    ctx.fillText('OVER-G',cx,cy+h*0.34);
  }
  if(p.gLoadT>0.05){
    const a=Math.min(0.9,p.gLoadT*0.75);
    const grd=ctx.createRadialGradient(cx,cy,h*0.10,cx,cy,h*0.62);
    grd.addColorStop(0,'rgba(0,0,0,0)');
    grd.addColorStop(1,'rgba(0,0,0,'+a+')');
    ctx.fillStyle=grd;ctx.fillRect(0,0,w,h);
  }
  if(p.g<-1.5){
    const a=Math.min(0.7,(-p.g-1.5)*0.16);
    ctx.fillStyle='rgba(120,0,80,'+a+')';
    ctx.fillRect(0,0,w,h);
  }
  ctx.shadowBlur=0;
  ctx.textAlign='left';
  ctx.fillStyle=MAGENTA;
  ctx.font='700 10px -apple-system,Helvetica,Arial';
  ctx.fillText('VIEW: '+VIEWS[camState.mode],12,h-26);
  ctx.fillStyle=accent;
  ctx.fillText(p.cfg.name.toUpperCase()+'  ·  '+p.cfg.gen+(p.cfg.gen==='5'?'TH GEN':' GEN'),12,h-14);
  ctx.restore();
}
function drawTape(x,cy,val,label,step,isLeft,accent){
  const H=150;
  const pxPerUnit=isLeft?1.15:0.085;
  ctx.save();
  ctx.strokeStyle=accent;ctx.fillStyle=accent;
  ctx.lineWidth=1.8;
  ctx.font='700 11px -apple-system,Helvetica,Arial';
  ctx.textAlign=isLeft?'right':'left';
  ctx.textBaseline='middle';
  const boxX=isLeft?x-58:x;
  ctx.strokeRect(boxX,cy-28,58,56);
  ctx.font='800 22px -apple-system,Helvetica,Arial';
  ctx.fillText(Math.abs(val).toString().padStart(isLeft?3:5,'0'),isLeft?x-8:x+8,cy);
  ctx.font='700 9px -apple-system,Helvetica,Arial';
  ctx.fillText(label,isLeft?x-8:x+8,cy+20);
  ctx.font='600 10px -apple-system,Helvetica,Arial';
  const range=H/pxPerUnit;
  const start=Math.floor((val-range)/step)*step;
  for(let v=start;v<=val+range;v+=step){
    const dy=(val-v)*pxPerUnit;
    if(Math.abs(dy)>H)continue;
    const y=cy+dy;
    const major=(Math.round(v/step)%5===0);
    const len=major?10:6;
    ctx.beginPath();
    if(isLeft){ctx.moveTo(x-64,y);ctx.lineTo(x-64-len,y);}
    else{ctx.moveTo(x+64,y);ctx.lineTo(x+64+len,y);}
    ctx.stroke();
    if(major)ctx.fillText(v.toString(),isLeft?x-80:x+80,y);
  }
  ctx.restore();
}

/* ================= LOOP ================= */
let fpsAcc=0,fpsN=0,fpsT=0;
const fpsEl=document.getElementById('fps');
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-lastT)/1000;
  lastT=now;
  if(dt>0.1)dt=0.1;
  if(dt<=0)dt=0.016;
  fpsAcc+=dt;fpsN++;fpsT+=dt;
  if(fpsT>0.6){fpsEl.textContent=Math.round(fpsN/fpsAcc)+' FPS';fpsAcc=0;fpsN=0;fpsT=0;}
  if(state.running&&!player.crashed){
    keyboardInput();
    const steps=dt>0.025?2:1;
    for(let i=0;i<steps;i++)physics(dt/steps);
    updateAudio();

    trailTimer+=dt;
    if(trailTimer>0.05 && player.ias>120 && !player.onGround){
      trailTimer=0;
      _fwd.set(0,0,-1).applyQuaternion(player.quat);
      _rgt.set(1,0,0).applyQuaternion(player.quat);
      const wing=player.cfg.wing?player.cfg.wing.span:5;
      const l=player.pos.clone().addScaledVector(_rgt,-wing).addScaledVector(_fwd,-player.cfg.L*0.1);
      const r=player.pos.clone().addScaledVector(_rgt, wing).addScaledVector(_fwd,-player.cfg.L*0.1);
      const trim=player.cfg.trim;
      const rr=(trim>>16)&255,gg=(trim>>8)&255,bb=trim&255;
      const comp=((0xff-rr)<<16) | ((0xff-gg)<<8) | (0xff-bb);
      spawnTrail(l,trim);
      spawnTrail(r,comp);
    }
  }else if(player.model){
    player.model.position.copy(player.pos);
    player.model.quaternion.copy(player.quat);
  }
  updateTrails(dt);
  if(player.model)updateCamera(dt);
  renderer.render(scene,camera);
  drawHUD();
}

/* ================= BOOT ================= */
resize();
requestAnimationFrame(t=>{lastT=t;loop(t);});
setTimeout(()=>{loading.style.display='none';},400);
document.addEventListener('touchmove',e=>{if(e.target.closest('#menu'))return;e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
})();
</script>
